<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6B4F">
<title>RÉPARTI</title>
<style>
:root{
  --bg:#F4F5F0; --surface:#FFFFFF; --surface2:#EEF1EA; --text:#16201B; --muted:#5F6A63; --faint:#8C968F;
  --border:#E1E5DD; --brand:#0E6B4F; --brand-ink:#FFFFFF; --brand-soft:#E2F0E8; --brand-strong:#0A5540;
  --s-income:#0E7A57; --s-expense:#D9822B;
  --danger:#B42318; --danger-soft:#FDEBE7; --warn:#9A6200; --warn-soft:#FBF0D9; --ok:#137A3F; --ok-soft:#E3F3E8;
  --info:#1D5FA8; --info-soft:#E6EFFA; --track:#E7EAE3;
  --shadow:0 1px 2px rgba(16,24,20,.05),0 6px 20px rgba(16,24,20,.05);
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111613; --surface:#1A1F1C; --surface2:#222925; --text:#ECF0ED; --muted:#A3ADA7; --faint:#7A847E;
    --border:#2C3430; --brand:#2FA77A; --brand-ink:#08130E; --brand-soft:#173A2C; --brand-strong:#5CC79C;
    --s-income:#24A06F; --s-expense:#D27A2C;
    --danger:#F0806F; --danger-soft:#3A1E1A; --warn:#E8B556; --warn-soft:#3A2F17; --ok:#5CC98A; --ok-soft:#183324;
    --info:#7FB2EE; --info-soft:#1A2A3D; --track:#2A322E; --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#1A1F1C; --surface2:#222925; --text:#ECF0ED; --muted:#A3ADA7; --faint:#7A847E;
  --border:#2C3430; --brand:#2FA77A; --brand-ink:#08130E; --brand-soft:#173A2C; --brand-strong:#5CC79C;
  --s-income:#24A06F; --s-expense:#D27A2C;
  --danger:#F0806F; --danger-soft:#3A1E1A; --warn:#E8B556; --warn-soft:#3A2F17; --ok:#5CC98A; --ok-soft:#183324;
  --info:#7FB2EE; --info-soft:#1A2A3D; --track:#2A322E; --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:24px;font-weight:750;letter-spacing:-.02em}
h2{font-size:17px;font-weight:700}
h3{font-size:15px;font-weight:650}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px}
.pos{color:var(--ok)} .neg{color:var(--danger)}

/* Shell */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--border);padding:22px 14px;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:18px}
.logo b{display:block;font-size:17px;letter-spacing:.06em}
.logo span{display:block;font-size:11px;color:var(--muted)}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:0;background:none;text-align:left;cursor:pointer;color:var(--muted);font-weight:550;width:100%}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.on{background:var(--brand-soft);color:var(--brand-strong)}
.nav-item .ic{width:22px;text-align:center}
.side .spacer{flex:1}
.main{padding:28px 32px 120px;max-width:1180px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head p{margin:4px 0 0;color:var(--muted)}
.bnav{display:none}
.fab{position:fixed;right:28px;bottom:28px;width:58px;height:58px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);font-size:30px;box-shadow:0 8px 24px rgba(14,107,79,.35);cursor:pointer;z-index:20}
.fab:hover{filter:brightness(1.08)}

/* Cards & grid */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-head .link{font-size:13px}
.stack{display:flex;flex-direction:column;gap:16px}
.hero{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-strong) 140%);color:var(--brand-ink);border:0;padding:26px}
:root[data-theme="dark"] .hero{background:var(--brand-soft);color:var(--text)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero{background:var(--brand-soft);color:var(--text)}}
.hero .lbl{opacity:.85;font-weight:600}
.hero .amount{font-size:42px;font-weight:800;letter-spacing:-.03em;margin:6px 0 4px}
.hero p{margin:0;opacity:.9;max-width:560px}
.hero .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.hero .btn{background:rgba(255,255,255,.16);color:inherit;border-color:rgba(255,255,255,.3)}
.hero .btn.solid{background:#fff;color:#0A5540;border-color:#fff}
:root[data-theme="dark"] .hero .btn.solid{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero .btn.solid{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;min-width:0}
.kpi .k{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center}
.kpi .v{font-size:19px;font-weight:750;margin-top:4px;letter-spacing:-.01em}
.kpi .d{font-size:12px;margin-top:2px}

/* Buttons & form */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:transparent;cursor:pointer;width:34px;height:34px;border-radius:8px;display:inline-grid;place-items:center;color:var(--muted);font-size:15px}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.link{color:var(--brand-strong);background:none;border:0;padding:0;cursor:pointer;font-weight:600}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.fld>span{font-size:13px;font-weight:600;color:var(--muted)}
.fld small{color:var(--faint);font-size:12px}
input[type=text],input[type=date],input[type=number],input:not([type]),select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 0}
.check input{width:18px;height:18px;accent-color:var(--brand)}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted);font-size:13.5px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px;font-weight:550}
.chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-strong)}
.chip.off{opacity:.5;text-decoration:line-through}
.monthnav{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:3px}
.monthnav b{min-width:140px;text-align:center;font-weight:650}

/* Lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.li:last-child{border-bottom:0}
.li .ic{width:38px;height:38px;border-radius:11px;background:var(--surface2);display:grid;place-items:center;font-size:18px;flex:none}
.li .main-t{flex:1;min-width:0}
.li .main-t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .main-t span{font-size:12.5px;color:var(--muted)}
.li .amt{font-weight:700;text-align:right}
.li .amt small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.day-h{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 2px}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.empty .e-ic{font-size:30px;margin-bottom:6px}

/* Progress */
.bar{height:8px;background:var(--track);border-radius:99px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px;min-width:0}
.bar.warn>i{background:var(--warn)} .bar.over>i{background:var(--danger)}
.bar.lg{height:12px}

/* Repartition */
.stackbar{display:flex;height:16px;border-radius:6px;overflow:hidden;gap:2px;margin:6px 0 16px;background:var(--surface)}
.stackbar>i{display:block;height:100%}
.stackbar>i:first-child{border-radius:6px 0 0 6px}.stackbar>i:last-child{border-radius:0 6px 6px 0}
.rep-row{display:grid;grid-template-columns:14px 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--border)}
.rep-row:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:3px}
.rep-total{display:flex;justify-content:space-between;font-weight:750;padding-top:10px;border-top:2px solid var(--text);margin-top:4px}
.equation{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:13.5px;margin-top:14px}
.equation b{font-weight:750}

/* Alerts */
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;margin-bottom:8px;font-size:14px}
.alert .a-ic{font-size:17px;line-height:1.2}
.alert .a-body{flex:1}
.alert.warn{background:var(--warn-soft)} .alert.danger{background:var(--danger-soft)} .alert.ok{background:var(--ok-soft)} .alert.info{background:var(--info-soft)}
.alert .btn{margin-top:6px}

/* Tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;color:var(--muted);font-weight:650;text-align:left;padding:8px 8px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.04em}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl tr.grp td{background:var(--surface2);font-weight:700;font-size:13px;padding:7px 8px}
.tbl-wrap{overflow-x:auto;margin:0 -4px}
.budget-name{display:flex;align-items:center;gap:10px;min-width:150px}
.budget-name .ic{font-size:17px}
.mini-bar{width:110px}
.txtable td{vertical-align:middle}
.tx-date{white-space:nowrap;width:72px}
.tx-date b{font-size:17px}
.tx-motif{display:flex;align-items:center;gap:10px;min-width:0}
.tx-ic{width:34px;height:34px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;flex:none}
.m-only{display:none}

/* Goal & debt cards */
.gcard .top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.gcard .top .ic{width:44px;height:44px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-size:22px}
.gcard .nums{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 6px}
.gcard .big{font-size:22px;font-weight:800}
.gcard .meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.gcard .tip{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:12px}
.gcard .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.tag{display:inline-block;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.danger{background:var(--danger-soft);color:var(--danger)}

/* Charts */
.hbar{display:grid;grid-template-columns:minmax(110px,170px) 1fr auto;gap:10px;align-items:center;padding:6px 0}
.hbar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.hbar .track{height:12px;border-radius:0 4px 4px 0;background:transparent;position:relative}
.hbar .track i{display:block;height:100%;background:var(--s-income);border-radius:0 4px 4px 0;min-width:2px}
.hbar:hover .track i{filter:brightness(1.1)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.chart svg{display:block;width:100%;height:auto}
.chart .gl{stroke:var(--border);stroke-width:1}
.chart text{fill:var(--muted);font-size:11px}
.chart .bi{fill:var(--s-income)} .chart .be{fill:var(--s-expense)}
.chart rect.hit{fill:transparent;cursor:pointer}
.chart rect.hit:hover{fill:var(--surface2);opacity:.6}
.tooltip{white-space:pre-line;position:fixed;pointer-events:none;background:var(--text);color:var(--bg);padding:8px 10px;border-radius:8px;font-size:12.5px;z-index:100;box-shadow:var(--shadow);display:none;max-width:240px}
.insight{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.insight:last-child{border-bottom:0}

/* Modal */
.overlay.dlg{z-index:80;align-items:center}
.overlay{position:fixed;inset:0;background:rgba(10,16,13,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;animation:fade .15s}
.modal{background:var(--surface);border-radius:20px;width:100%;max-width:520px;max-height:calc(100vh - 40px);overflow:auto;padding:22px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{max-width:720px}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.mh h2{font-size:19px}
.mf{display:flex;justify-content:flex-end;gap:10px;margin-top:8px;padding-top:14px;border-top:1px solid var(--border);flex-wrap:wrap}
.mf .left{margin-right:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px;border-radius:14px;border:1px solid var(--border);background:var(--surface);cursor:pointer;text-align:left}
.quick button:hover{border-color:var(--brand);background:var(--brand-soft)}
.quick button .q-ic{font-size:24px}
.quick button b{font-weight:700}
.quick button span{font-size:12.5px;color:var(--muted)}
.alloc-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;background:var(--surface2);border-radius:14px;padding:14px 16px;margin-bottom:14px;flex-wrap:wrap}
.alloc-top .big{font-size:26px;font-weight:800}
.alloc-top .fld{margin:0;min-width:220px}
.alloc-table input{padding:7px 9px;text-align:right}
.alloc-table td{padding:6px 6px}
.alloc-table .pin{width:72px}
.alloc-table .ain{width:130px}
.alloc-sum{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;margin-top:12px;font-weight:650;flex-wrap:wrap}
.alloc-sum.ok{background:var(--ok-soft)} .alloc-sum.warn{background:var(--warn-soft)} .alloc-sum.danger{background:var(--danger-soft)}
.hint{background:var(--info-soft);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:-4px 0 14px}
.hint.warn{background:var(--warn-soft)}

/* Toast */
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;z-index:200;box-shadow:var(--shadow);animation:fade .2s;max-width:calc(100vw - 32px)}

/* Onboarding */
.ob{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.ob-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;max-width:640px;width:100%;padding:32px;box-shadow:var(--shadow)}
.ob-steps{display:flex;gap:6px;margin-bottom:26px}
.ob-steps i{flex:1;height:5px;border-radius:9px;background:var(--track)}
.ob-steps i.on{background:var(--brand)}
.ob h1{font-size:28px;margin-bottom:8px}
.ob .lead{color:var(--muted);margin:0 0 22px;font-size:16px}
.ob-foot{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand)}
.opt .grow{flex:1}
.opt .bal{width:150px}
.ob-group{margin-bottom:16px}
.ob-group h3{margin-bottom:8px}
.tagline{font-size:13px;letter-spacing:.04em;color:var(--brand-strong);font-weight:700;text-transform:uppercase;margin-bottom:10px}

/* Responsive */
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:18px 16px 110px}
  .g2,.g3{grid-template-columns:1fr}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:30;justify-content:space-around}
  .bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 6px;cursor:pointer;min-width:58px;font-weight:600}
  .bnav button .ic{font-size:20px}
  .bnav button.on{color:var(--brand-strong)}
  .bnav .plus{width:52px;height:52px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-size:28px;margin-top:-22px;box-shadow:0 6px 18px rgba(14,107,79,.35);justify-content:center;min-width:52px}
  .fab{display:none}
  .hero .amount{font-size:34px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .overlay{align-items:flex-end;padding:0}
  .modal{border-radius:20px 20px 0 0;max-height:92vh;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .row3{grid-template-columns:1fr 1fr}
  .ob-card{padding:24px 18px}
  .opt .bal{width:120px}
  .hbar{grid-template-columns:96px 1fr auto}
  .mini-bar{width:70px}
  .d-only{display:none}
  .m-only{display:inline}
  .tx-ic{display:none}
  .txtable td,.txtable th{padding:9px 3px}
  .tx-date{width:44px}
  .tx-date b{font-size:15px}
  .txtable td:last-child{width:32px}
  .txtable td:last-child .icon-btn{display:block;width:30px;height:30px}
  .txtable .num b{font-size:13.5px}
  .txtable .tx-motif b{word-break:break-word}
  .alloc-table .ain{width:105px}
  .alloc-table .pin{width:58px}
  h1{font-size:21px}
}
@media print{
  .side,.bnav,.fab,.no-print{display:none!important}
  .shell{display:block} .main{padding:0}
  .card{box-shadow:none;break-inside:avoid}
  body{background:#fff}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>

<script>
"use strict";
/* ================== RÉPARTI — Ton argent. Tes règles. Chaque franc à sa place. ================== */
const KEY = 'reparti.data.v1';
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => isoOf(new Date());
const mKey = d => String(d || '').slice(0, 7);
const curMonth = () => mKey(today());
const addMonth = (m, k) => { let [y, mm] = m.split('-').map(Number); mm += k; while (mm > 12) { mm -= 12; y++; } while (mm < 1) { mm += 12; y--; } return y + '-' + pad(mm); };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const monthLabel = m => { const [y, mm] = m.split('-').map(Number); return cap(new Date(y, mm - 1, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })); };
const monthShort = m => { const [y, mm] = m.split('-').map(Number); return cap(new Date(y, mm - 1, 1).toLocaleDateString('fr-FR', { month: 'short' }).replace('.', '')); };
const fmtDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
const fmtDay = d => cap(new Date(d + 'T00:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }));
const num = v => { if (typeof v === 'number') return isFinite(v) ? v : 0; const n = parseFloat(String(v ?? '').replace(/[\s  ]/g, '').replace(',', '.')); return isFinite(n) ? n : 0; };
const cur = () => (S && S.user && S.user.currency) || 'FCFA';
const fmtN = n => Math.round(n).toLocaleString('fr-FR').replace(/[  ]/g, ' ');
const fmt = n => fmtN(n) + ' ' + cur();
const fmtS = n => (n > 0 ? '+' : n < 0 ? '−' : '') + fmtN(Math.abs(n)) + ' ' + cur();
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const pos = n => Math.max(0, n);
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);

/* ---------- Données par défaut ---------- */
const ICONS = { 'Loyer':'🔑','Électricité':'⚡','Eau':'💧','Internet':'🌐','Entretien':'🧰','Charges':'🧾','Alimentation':'🍽️','Courses':'🛒','Restaurant':'🍴','Transport':'🚕','Carburant':'⛽','Téléphone':'📱','Santé':'🩺','Beauté':'💄','Vêtements':'👗','Sport':'🏃','Loisirs':'🎉','Parents':'👵','Enfants':'🧒','Aide familiale':'🤝','Cadeaux':'🎁','Frais bancaires':'🏦','Urgences':'🚑','Imprévus':'🧯',
  'Salaire':'💼','Freelance':'🧑‍💻','Prestation':'🛠️','Commission':'🤝','Prime':'⭐','Bonus':'🎯','Vente':'🏷️','Business':'📦','Boutique':'🏪','E-commerce':'🛍️','Dividendes':'📈','Intérêts':'💹','Investissements':'📊','Cadeau':'🎁','Remboursement':'↩️','Autre':'➕' };
const EXPENSE_DEFAULTS = [
  ['Logement', '🏠', ['Loyer', 'Électricité', 'Eau', 'Internet', 'Entretien', 'Charges']],
  ['Vie quotidienne', '🍽️', ['Alimentation', 'Courses', 'Restaurant', 'Transport', 'Carburant', 'Téléphone']],
  ['Personnel', '❤️', ['Santé', 'Beauté', 'Vêtements', 'Sport', 'Loisirs']],
  ['Famille', '👨‍👩‍👧', ['Parents', 'Enfants', 'Aide familiale', 'Cadeaux']],
  ['Finance', '💰', ['Frais bancaires']],
  ['Sécurité', '🧯', ['Urgences', 'Imprévus']],
];
const INCOME_DEFAULTS = [
  ['Revenus professionnels', '💼', ['Salaire', 'Freelance', 'Prestation', 'Commission', 'Prime', 'Bonus']],
  ['Revenus commerciaux', '🏪', ['Vente', 'Business', 'Boutique', 'E-commerce']],
  ['Revenus financiers', '📈', ['Dividendes', 'Intérêts', 'Investissements']],
  ['Autres', '➕', ['Cadeau', 'Remboursement', 'Autre']],
];
const INCOME_TYPES = [
  ['salaire', 'Salaire fixe', ['Salaire', 'Prime', 'Bonus']],
  ['variable', 'Revenus variables', ['Commission', 'Prestation']],
  ['freelance', 'Freelance', ['Freelance', 'Prestation']],
  ['business', 'Business', ['Vente', 'Business', 'Boutique', 'E-commerce']],
  ['multi', 'Plusieurs revenus', ['Dividendes', 'Intérêts', 'Investissements']],
];
const ACCOUNT_PRESETS = [
  { key: 'banque', name: 'Banque', icon: '🏦', type: 'banque' },
  { key: 'wave', name: 'Wave', icon: '🔵', type: 'mobile' },
  { key: 'om', name: 'Orange Money', icon: '🟠', type: 'mobile' },
  { key: 'apple', name: 'Apple Pay', icon: '🍎', type: 'carte' },
  { key: 'cash', name: 'Espèces', icon: '💵', type: 'especes' },
  { key: 'epargne', name: 'Compte épargne', icon: '💰', type: 'epargne' },
];
const ACCOUNT_TYPES = { banque: 'Compte bancaire', mobile: 'Mobile Money', carte: 'Carte / Wallet', especes: 'Espèces', epargne: 'Compte épargne', invest: 'Compte investissement', autre: 'Autre' };
const DEBT_TYPES = ['🏦 Crédit bancaire', '👨‍👩‍👧 Dette familiale', '🤝 Dette envers un ami', '💳 Carte bancaire', '🛒 Achat à crédit', '🚗 Crédit véhicule', '🏠 Crédit immobilier', '🎓 Prêt étudiant', '📱 Paiement échelonné', '📦 Fournisseur', '📄 Autre'];
const CURRENCIES = ['FCFA', 'GNF', 'MAD', 'XAF', 'EUR', 'USD', 'CAD', 'GBP'];
const RECUR = { mensuelle: 'Mensuelle', hebdomadaire: 'Hebdomadaire', annuelle: 'Annuelle', ponctuelle: 'Ponctuelle' };

function blankState() {
  return { v: 1, onboarded: false, user: { name: '', currency: 'FCFA' }, createdAt: today(), lastExport: null,
    accounts: [], categories: [], goals: [], debts: [], models: [], tx: [], alloc: [],
    debtTypes: DEBT_TYPES.slice(), lastModelByCat: {}, seenReport: null };
}
function makeCats(kind, defs, filter) {
  const out = [];
  defs.forEach(([group, gicon, names]) => names.forEach(name => {
    if (filter && !filter(name, group)) return;
    out.push({ id: uid(), kind, name, icon: ICONS[name] || gicon, group, mode: kind === 'expense' ? 'variable' : 'variable', amount: 0, pct: 0, recurrence: 'mensuelle', accountId: '', archived: false });
  }));
  return out;
}

/* ---------- Persistance ---------- */
let S = null;
function load() {
  try { const r = localStorage.getItem(KEY); if (r) { const d = JSON.parse(r); return Object.assign(blankState(), d); } } catch (e) { console.warn(e); }
  return null;
}
function save() {
  if (S) S.savedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { if (!CLOUD.uid) toast('⚠️ Sauvegarde locale impossible : exporte une sauvegarde depuis Paramètres.'); }
  scheduleCloud(); scheduleSb();
}
S = load();

/* ---------- Synchronisation (version en ligne sur claude.ai) ---------- */
// Ouvert sur claude.ai, RÉPARTI garde aussi les données dans un espace privé lié au compte :
// on les retrouve sur tous ses appareils. Fichier téléchargé : appareil seulement.
const CLOUD = { db: null, uid: null, ready: false, timer: null, sent: [], status: 'local' };
const CHUNK = 60000;
const cloudDoc = name => CLOUD.db.doc('data/users/' + CLOUD.uid + '/' + name);
async function initCloud() {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    CLOUD.db = db; CLOUD.uid = id;
    const meta = await cloudDoc('reparti-meta').get();
    if (meta.exists) {
      const m = meta.data(); const parts = [];
      for (let i = 0; i < m.n; i++) { const c = await cloudDoc('reparti-c' + i).get(); parts.push(c.exists ? c.data().s : ''); }
      CLOUD.sent = parts.slice();
      const remote = JSON.parse(parts.join(''));
      if (!S || !S.onboarded || num(remote.savedAt) >= num(S.savedAt)) {
        S = Object.assign(blankState(), remote);
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
        if (!modalCtx) render();
      }
    }
    CLOUD.ready = true; CLOUD.status = 'ok';
    if (S && S.onboarded && (!meta.exists || num(S.savedAt) > num(meta.data().savedAt))) pushCloud();
    refreshSync();
  } catch (e) { console.warn('sync', e); CLOUD.status = 'error'; refreshSync(); }
}
function scheduleCloud() { if (!CLOUD.ready) return; clearTimeout(CLOUD.timer); CLOUD.timer = setTimeout(pushCloud, 1200); }
async function pushCloud() {
  if (!CLOUD.ready) return;
  try {
    CLOUD.status = 'saving'; refreshSync();
    const json = S ? JSON.stringify(S) : '';
    const parts = []; for (let i = 0; i < json.length; i += CHUNK) parts.push(json.slice(i, i + CHUNK));
    for (let i = 0; i < parts.length; i++) if (CLOUD.sent[i] !== parts[i]) await cloudDoc('reparti-c' + i).set({ s: parts[i] });
    for (let i = parts.length; i < CLOUD.sent.length; i++) await cloudDoc('reparti-c' + i).delete();
    if (S) await cloudDoc('reparti-meta').set({ n: parts.length, savedAt: num(S.savedAt) });
    else await cloudDoc('reparti-meta').delete();
    CLOUD.sent = parts; CLOUD.status = 'ok';
  } catch (e) { console.warn('sync', e); CLOUD.status = 'error'; }
  refreshSync();
}
function syncLabel() {
  if (sbEnabled() && SB.session) return { ok: '☁️ Synchronisé · ' + sbWho(), saving: '☁️ Synchronisation…', offline: '📴 Hors ligne : synchronisation au retour du réseau', error: '⚠️ Synchronisation en attente, nouvel essai bientôt' }[SB.status];
  if (sbEnabled()) return '📱 Sur cet appareil uniquement : connecte-toi pour synchroniser';
  return { ok: '☁️ Synchronisé avec ton compte', saving: '☁️ Enregistrement…', error: '⚠️ Synchronisation impossible — données gardées sur cet appareil', local: '📱 Données sur cet appareil uniquement' }[CLOUD.status];
}
function refreshSync() { document.querySelectorAll('[data-sync]').forEach(el => el.textContent = syncLabel()); }

/* ---------- Compte & synchronisation sur tous les appareils (version installée) ---------- */
// Adresse et clé publique (« anon public ») du projet Supabase. La clé anon peut être publique :
// les règles de sécurité de la table (voir supabase-reparti.sql) empêchent chacun de lire les données des autres.
// Les valeurs se règlent dans config.js (fichier à côté de reparti.html), sans toucher à ce fichier.
const CONFIG = Object.assign({ supabaseUrl: '', supabaseAnonKey: '', phoneLogin: false }, window.REPARTI_CONFIG || {});
CONFIG.supabaseUrl = String(CONFIG.supabaseUrl || '').trim().replace(/\/(rest|auth|storage)\/v1.*$/i, '').replace(/\/+$/, ''); // accepte aussi une adresse copiée avec /rest/v1/ CONFIG.supabaseAnonKey = String(CONFIG.supabaseAnonKey || '').trim();
if (/COLLE|xxxx/i.test(CONFIG.supabaseUrl + CONFIG.supabaseAnonKey)) { CONFIG.supabaseUrl = ''; CONFIG.supabaseAnonKey = ''; }
const SB_KEY = 'reparti.session.v1';
const SB = { session: null, status: 'ok', timer: null, busy: false, lastPull: 0, again: false };
const sbEnabled = () => !!(CONFIG.supabaseUrl && CONFIG.supabaseAnonKey) && window.top === window.self;
try { SB.session = JSON.parse(localStorage.getItem(SB_KEY) || 'null'); } catch (e) {}
function sbStore() { try { SB.session ? localStorage.setItem(SB_KEY, JSON.stringify(SB.session)) : localStorage.removeItem(SB_KEY); } catch (e) {} }
function localWrite() { try { S ? localStorage.setItem(KEY, JSON.stringify(S)) : localStorage.removeItem(KEY); } catch (e) {} }
async function sbFetch(path, { method = 'GET', body, auth = true, headers = {} } = {}) {
  const h = Object.assign({ apikey: CONFIG.supabaseAnonKey, 'Content-Type': 'application/json' }, headers);
  if (auth) { await sbEnsure(); if (SB.session) h.Authorization = 'Bearer ' + SB.session.access_token; }
  const r = await fetch(CONFIG.supabaseUrl.replace(/\/$/, '') + path, { method, headers: h, body: body ? JSON.stringify(body) : undefined });
  const t = await r.text(); let j = null; try { j = t ? JSON.parse(t) : null; } catch (e) {}
  if (!r.ok) throw { status: r.status, message: (j && (j.msg || j.message || j.error_description || j.error)) || r.statusText };
  return j;
}
function sbSetSession(j) { SB.session = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000, user: { id: j.user.id, email: j.user.email || '', phone: j.user.phone || '' } }; sbStore(); }
async function sbEnsure() {
  const s = SB.session; if (!s || s.expires_at - 60000 > Date.now()) return;
  try { sbSetSession(await sbFetch('/auth/v1/token?grant_type=refresh_token', { method: 'POST', auth: false, body: { refresh_token: s.refresh_token } })); }
  catch (e) { if (e.status === 400 || e.status === 401) { SB.session = null; sbStore(); refreshSync(); toast('Ta session a expiré : reconnecte-toi dans Paramètres.'); } throw e; }
}
function sbIdent(v) {
  v = String(v || '').trim(); if (v.includes('@')) return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v) ? { email: v.toLowerCase() } : null;
  let p = v.replace(/[\s.\-()]/g, ''); if (p.startsWith('00')) p = '+' + p.slice(2);
  if (!p.startsWith('+') && /^\d{9}$/.test(p)) p = '+221' + p; // numéro sénégalais sans indicatif
  return /^\+\d{8,15}$/.test(p) ? { phone: p } : null;
}
function sbErr(e, step) {
  if (!e || e.status === undefined) return "Impossible de joindre Supabase : vérifie ta connexion internet et l'adresse supabaseUrl dans config.js.";
  const m = String(e.message || ''); const raw = m ? ` (détail : ${m})` : ` (code ${e.status})`;
  if (e.status === 429 || /security purposes|rate limit/i.test(m)) return 'Trop de demandes rapprochées. Patiente 1 minute puis réessaie.' + raw;
  if (/api key|apikey|jwt/i.test(m) || (e.status === 401 && step === 'send')) return 'La clé supabaseAnonKey dans config.js est incorrecte : recopie la clé « anon public » de Supabase.' + raw;
  if (e.status === 404) return "L'adresse supabaseUrl dans config.js est incorrecte : recopie le « Project URL » de Supabase." + raw;
  if (/sending|smtp|mail/i.test(m) && step === 'send') return "Supabase n'arrive pas à envoyer l'e-mail : vérifie les réglages SMTP (Gmail, mot de passe d'application) dans Supabase." + raw;
  if (/signups? not allowed|disabled/i.test(m)) return "Les inscriptions sont désactivées dans Supabase : Authentication → Sign In / Providers → active « Allow new users to sign up » et le fournisseur Email." + raw;
  if (step === 'verify' && /expired|invalid|otp|token/i.test(m)) return 'Code incorrect ou expiré. Utilise le DERNIER code reçu (chaque nouvel envoi annule le précédent).' + raw;
  return 'Erreur' + raw;
}
// Affiche l'erreur dans la fenêtre (reste visible, contrairement à un toast)
function sbShowErr(msg) { const f = $('#mform'); if (!f) return toast('❌ ' + esc(msg)); let el = f.querySelector('.sb-err'); if (!el) { el = document.createElement('div'); el.className = 'hint warn sb-err'; f.querySelector('.mf').before(el); } el.textContent = '❌ ' + msg; }
const sbWho = () => SB.session ? (SB.session.user.email || SB.session.user.phone) : '';
const sbRowPath = () => '/rest/v1/reparti_data?user_id=eq.' + SB.session.user.id;
async function sbGetRow() { const rows = await sbFetch(sbRowPath() + '&select=data,updated_at'); return rows && rows[0] ? rows[0] : null; }
async function sbPush() {
  if (!S) { await sbFetch(sbRowPath(), { method: 'DELETE', headers: { Prefer: 'return=minimal' } }); return; }
  await sbFetch('/rest/v1/reparti_data?on_conflict=user_id', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: { user_id: SB.session.user.id, data: S, updated_at: new Date().toISOString() } });
}
// Synchronise : la version la plus récente (sur l'appareil ou dans le compte) l'emporte.
async function sbSync() {
  if (!sbEnabled() || !SB.session) return;
  if (SB.busy) { SB.again = true; return; }
  SB.busy = true; SB.status = 'saving'; refreshSync();
  try {
    const row = await sbGetRow(); SB.lastPull = Date.now();
    const remoteAt = row ? num(row.data && row.data.savedAt) : -1; const localAt = S && S.onboarded ? num(S.savedAt) : -1;
    if (row && remoteAt > localAt) {
      if (modalCtx || DLG) SB.again = true; // ne pas interrompre une saisie en cours
      else { S = Object.assign(blankState(), row.data); localWrite(); OB = null; render(); }
    } else if (localAt > remoteAt || (!S && row)) await sbPush();
    SB.status = 'ok';
  } catch (e) { console.warn('sync', e); SB.status = navigator.onLine === false ? 'offline' : 'error'; }
  SB.busy = false; refreshSync();
  if (SB.again) { SB.again = false; setTimeout(sbSync, 4000); }
}
function scheduleSb() { if (!sbEnabled() || !SB.session) return; clearTimeout(SB.timer); SB.timer = setTimeout(sbSync, 1500); }
async function sbAfterLogin() {
  SB.status = 'saving'; refreshSync();
  try {
    const row = await sbGetRow();
    if (row) {
      const local = S && S.onboarded && S.tx.length && JSON.stringify(row.data.tx) !== JSON.stringify(S.tx);
      const useRemote = local ? await uiDialog('Ton compte contient déjà des données RÉPARTI, différentes de celles de cet appareil.\nLesquelles veux-tu garder ?', false, 'Celles du compte', 'Celles de cet appareil') : true;
      if (useRemote) { S = Object.assign(blankState(), row.data); localWrite(); OB = null; }
      else { S.savedAt = Date.now(); localWrite(); await sbPush(); }
    } else if (S && S.onboarded) await sbPush();
    SB.status = 'ok';
  } catch (e) { console.warn('sync', e); SB.status = 'error'; }
  refreshSync(); render();
  toast('Connecté ✓ Tes données se synchronisent sur tous tes appareils.');
}
function formLogin(step = 1, id = null) {
  const ph = CONFIG.phoneLogin;
  if (step === 1) {
    openModal(`${mh('☁️ Se connecter / créer un compte')}<form id="mform">
      <p class="small muted" style="margin-top:-6px">Tu reçois un code à 6 chiffres ${ph ? 'par e-mail ou par SMS' : 'par e-mail'}, sans mot de passe à retenir. Connecte-toi avec le même ${ph ? 'e-mail ou numéro' : 'e-mail'} sur ton ordinateur, ta tablette et ton téléphone : tes données suivent automatiquement.</p>
      <label class="fld"><span>${ph ? 'Adresse e-mail ou numéro de téléphone' : 'Adresse e-mail'}</span><input name="ident" required autofocus autocomplete="${ph ? 'username' : 'email'}" inputmode="${ph ? 'text' : 'email'}" placeholder="${ph ? 'toi@gmail.com ou 77 123 45 67' : 'toi@gmail.com'}"></label>
      ${ph ? '<p class="small faint" style="margin-top:-8px">Numéro hors Sénégal : mets l\'indicatif (ex. +225…).</p>' : ''}
      ${mf('Recevoir mon code')}</form>`, {
      async onSubmit(f, form) {
        const ident = sbIdent(f.ident); if (!ident || (ident.phone && !ph)) return toast(ph ? 'Adresse e-mail ou numéro invalide.' : 'Adresse e-mail invalide.');
        const b = form.querySelector('[type=submit]'); b.disabled = true; b.textContent = 'Envoi…';
        try { await sbFetch('/auth/v1/otp' + sbRedirect(), { method: 'POST', auth: false, body: Object.assign({ create_user: true }, ident) }); formLogin(2, ident); }
        catch (e) { sbShowErr(sbErr(e, 'send')); b.disabled = false; b.textContent = 'Recevoir mon code'; }
      }
    });
  } else {
    openModal(`${mh('Entre ton code')}<form id="mform">
      <p class="small muted" style="margin-top:-6px">Code envoyé à <b>${esc(id.email || id.phone)}</b>${id.email ? ' (pense à regarder dans les spams). Si l\'e-mail contient un <b>lien</b> au lieu d\'un code, clique simplement sur ce lien : il te connecte directement.' : ''}</p>
      <label class="fld"><span>Code reçu</span><input name="code" required autofocus inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="123456" style="font-size:22px;letter-spacing:.3em;text-align:center"></label>
      <div class="small" style="display:flex;gap:16px;margin-bottom:6px"><button type="button" class="link" data-act="loginResend">Renvoyer le code</button><button type="button" class="link" data-act="login">Changer ${id.email ? "d'adresse" : 'de numéro'}</button></div>
      ${mf('Valider')}</form>`, {
      ident: id,
      async onSubmit(f, form) {
        const code = String(f.code || '').replace(/\D/g, ''); if (!/^\d{4,10}$/.test(code)) return toast('Le code ne contient que des chiffres.');
        const b = form.querySelector('[type=submit]'); b.disabled = true; b.textContent = 'Vérification…';
        try {
          sbSetSession(await sbFetch('/auth/v1/verify', { method: 'POST', auth: false, body: id.email ? { type: 'email', email: id.email, token: code } : { type: 'sms', phone: id.phone, token: code } }));
          closeModal(); await sbAfterLogin();
        } catch (e) { sbShowErr(sbErr(e, 'verify')); b.disabled = false; b.textContent = 'Valider'; }
      }
    });
  }
}
// Adresse où revient le lien de connexion reçu par e-mail (si l'e-mail contient un lien plutôt qu'un code)
function sbRedirect() { return /^https?:$/.test(location.protocol) ? '?redirect_to=' + encodeURIComponent(location.origin + location.pathname) : ''; }
// Connexion par lien : Supabase renvoie vers l'application avec #access_token=…&refresh_token=…
async function sbFromHash() {
  if (!sbEnabled() || !location.hash) return false;
  const h = new URLSearchParams(location.hash.slice(1));
  if (!h.get('access_token') && !h.get('error_description')) return false;
  history.replaceState(null, '', location.pathname + location.search);
  if (h.get('error_description')) { toast('❌ Lien de connexion expiré ou déjà utilisé : demande un nouveau code.'); return false; }
  try {
    const user = await sbFetch('/auth/v1/user', { auth: false, headers: { Authorization: 'Bearer ' + h.get('access_token') } });
    sbSetSession({ access_token: h.get('access_token'), refresh_token: h.get('refresh_token'), expires_in: +h.get('expires_in') || 3600, user });
    await sbAfterLogin(); return true;
  } catch (e) { toast('❌ ' + esc(sbErr(e, 'verify'))); return false; }
}

/* ---------- Moteur financier ---------- */
function calc() {
  const acc = {}, env = {}, goal = {}, dEnv = {}, dPaid = {};
  S.accounts.forEach(a => acc[a.id] = num(a.initial));
  S.categories.forEach(c => { if (c.kind === 'expense') env[c.id] = 0; });
  S.goals.forEach(g => goal[g.id] = num(g.initial));
  S.debts.forEach(d => { dEnv[d.id] = 0; dPaid[d.id] = num(d.alreadyPaid); });
  for (const t of S.tx) {
    const a = num(t.amount);
    if (t.type === 'income') { if (t.accountId in acc) acc[t.accountId] += a; }
    else if (t.type === 'expense') {
      if (t.accountId in acc) acc[t.accountId] -= a;
      if (t.goalId) { if (t.goalId in goal) goal[t.goalId] -= a; }
      else if (t.catId in env) env[t.catId] -= a;
    }
    else if (t.type === 'transfer') { if (t.accountId in acc) acc[t.accountId] -= a; if (t.toAccountId in acc) acc[t.toAccountId] += a; }
    else if (t.type === 'debt') { if (t.accountId in acc) acc[t.accountId] -= a; if (t.debtId in dEnv) { dEnv[t.debtId] -= a; dPaid[t.debtId] += a; } }
    else if (t.type === 'adjust') { if (t.accountId in acc) acc[t.accountId] += a; }
  }
  for (const x of S.alloc) {
    const a = num(x.amount);
    if (x.t === 'cat' && x.id in env) env[x.id] += a;
    else if (x.t === 'goal' && x.id in goal) goal[x.id] += a;
    else if (x.t === 'debt' && x.id in dEnv) dEnv[x.id] += a;
  }
  const total = Object.values(acc).reduce((s, v) => s + v, 0);
  const envPos = Object.values(env).reduce((s, v) => s + pos(v), 0);
  const goalPos = Object.values(goal).reduce((s, v) => s + pos(v), 0);
  const debtPos = Object.values(dEnv).reduce((s, v) => s + pos(v), 0);
  const affected = envPos + goalPos + debtPos;
  const remaining = {};
  S.debts.forEach(d => remaining[d.id] = Math.max(0, num(d.initial) - dPaid[d.id]));
  const debtTotal = Object.values(remaining).reduce((s, v) => s + v, 0);
  return { acc, env, goal, dEnv, dPaid, remaining, total, envPos, goalPos, debtPos, affected, available: total - affected, debtTotal, netWorth: total - debtTotal };
}
function monthStats(m) {
  const r = { income: 0, expense: 0, debt: 0, savings: 0, invest: 0, byCat: {}, incByCat: {}, allocCat: {}, allocGoal: {}, allocDebt: {}, debtBy: {}, count: 0 };
  for (const t of S.tx) {
    if (mKey(t.date) !== m) continue;
    const a = num(t.amount); r.count++;
    if (t.type === 'income') { r.income += a; r.incByCat[t.catId] = (r.incByCat[t.catId] || 0) + a; }
    else if (t.type === 'expense') { r.expense += a; const k = t.goalId ? 'g:' + t.goalId : t.catId; r.byCat[k] = (r.byCat[k] || 0) + a; }
    else if (t.type === 'debt') { r.debt += a; r.debtBy[t.debtId] = (r.debtBy[t.debtId] || 0) + a; }
  }
  for (const x of S.alloc) {
    if (mKey(x.date) !== m) continue;
    const a = num(x.amount);
    if (x.t === 'cat') r.allocCat[x.id] = (r.allocCat[x.id] || 0) + a;
    else if (x.t === 'goal') { r.allocGoal[x.id] = (r.allocGoal[x.id] || 0) + a; const g = goalById(x.id); if (g && g.kind === 'investissement') r.invest += a; else r.savings += a; }
    else if (x.t === 'debt') r.allocDebt[x.id] = (r.allocDebt[x.id] || 0) + a;
  }
  r.left = r.income - r.expense - r.debt - r.savings - r.invest;
  return r;
}
const RECUR_FACTOR = { mensuelle: 1, hebdomadaire: 52 / 12, annuelle: 1 / 12, ponctuelle: 1 };
function planned(c, m, st) {
  if (c.mode === 'fixe') return num(c.amount) * (RECUR_FACTOR[c.recurrence] || 1);
  if (c.mode === 'pct') return num(c.pct) / 100 * (st || monthStats(m)).income;
  return 0;
}
const catById = id => S.categories.find(c => c.id === id);
const goalById = id => S.goals.find(g => g.id === id);
const debtById = id => S.debts.find(d => d.id === id);
const accById = id => S.accounts.find(a => a.id === id);
const activeAccounts = () => S.accounts.filter(a => !a.archived);
const expCats = () => S.categories.filter(c => c.kind === 'expense' && !c.archived);
const incCats = () => S.categories.filter(c => c.kind === 'income' && !c.archived);
const groupsOf = list => { const g = []; list.forEach(c => { if (!g.includes(c.group)) g.push(c.group); }); return g; };

function goalInfo(g, bal) {
  const target = num(g.target);
  const p = target > 0 ? Math.min(100, Math.round(bal / target * 100)) : 0;
  const rest = pos(target - bal);
  let monthly = 0, months = 0, status = null;
  if (target > 0 && g.deadline) {
    const days = daysBetween(today(), g.deadline);
    months = Math.max(1, Math.ceil(days / 30.44));
    monthly = rest / months;
    const start = g.createdAt || S.createdAt; const totalDays = daysBetween(start, g.deadline); const elapsed = daysBetween(start, today());
    if (rest <= 0) status = 'done';
    else if (days < 0) status = 'late';
    else if (totalDays > 0 && elapsed > 0) {
      const expected = num(g.startAmount ?? g.initial) + (target - num(g.startAmount ?? g.initial)) * Math.min(1, elapsed / totalDays);
      status = bal >= expected * 1.05 ? 'ahead' : bal < expected * 0.9 ? 'behind' : 'ontrack';
    }
  } else if (target > 0 && rest <= 0) status = 'done';
  return { target, p, rest, monthly, months, status };
}
function debtNext(d, C) {
  const rem = C.remaining[d.id];
  if (rem <= 0) return null;
  const day = Math.min(28, Math.max(1, num(d.dueDay) || 1));
  const m = curMonth();
  const paidThisMonth = S.tx.some(t => t.type === 'debt' && t.debtId === d.id && mKey(t.date) === m);
  const date = (paidThisMonth ? addMonth(m, 1) : m) + '-' + pad(day);
  const amount = Math.min(rem, num(d.monthly) || rem);
  return { date, amount, after: rem - amount, inDays: daysBetween(today(), date) };
}

function targets() {

  S.debts.filter(d => !d.archived).forEach(d => out.push({ key: 'debt:' + d.id, t: 'debt', id: d.id, name: d.label, icon: '💳', group: 'Dettes' }));
  return out;
}
function targetLabel(t, id) {
  if (t === 'cat') { const c = catById(id); return c ? c.icon + ' ' + c.name : 'Ligne supprimée'; }
  if (t === 'goal') { const g = goalById(id); return g ? (g.icon || '🎯') + ' ' + g.name : 'Objectif supprimé'; }
  if (t === 'debt') { const d = debtById(id); return d ? '💳 ' + d.label : 'Dette supprimée'; }
  return '—';
}
function targetBal(C, key) {
  if (!key || key === 'free') return C.available;

  return t === 'cat' ? (C.env[id] || 0) : t === 'goal' ? (C.goal[id] || 0) : (C.dEnv[id] || 0);
}
function addAlloc(key, amount, date, txId, note) {
  const [t, id] = key.split(':');
  S.alloc.push({ id: uid(), t, id, amount: Math.round(amount), date: date || today(), txId: txId || null, note: note || '' });
}
function targetOptions(selected, { withFree = false, C = null, freeLabel = 'Argent non affecté' } = {}) {

  });
  return h;
}
function accountOptions(sel) { return activeAccounts().map(a => `<option value="${a.id}" ${a.id === sel ? 'selected' : ''}>${esc(a.icon + ' ' + a.name)}</option>`).join(''); }
function catOptions(kind, sel, withNew = true) {

}

function alerts(C) {
  const out = []; const m = curMonth(); const st = monthStats(m);
  if (C.available >= 1) out.push({ lvl: 'info', ic: '💰', msg: `Tu as <b>${fmt(C.available)}</b> non affectés. Donne une destination à chaque franc.`, act: `<button class="btn sm primary" data-act="distribute">Répartir</button>` });
  if (C.available <= -1) out.push({ lvl: 'danger', ic: '🔴', msg: `Tu as affecté <b>${fmt(-C.available)}</b> de plus que ce que tu possèdes réellement. Retire de l'argent d'une enveloppe ou vérifie les soldes de tes comptes.`, act: `<button class="btn sm" data-act="move">Ajuster</button>` });
  expCats().forEach(c => {
    const spent = st.byCat[c.id] || 0; const base = planned(c, m, st) || (st.allocCat[c.id] || 0);
    const env = C.env[c.id] || 0;
    if (env < -0.5) out.push({ lvl: 'danger', ic: '🔴', msg: `Enveloppe <b>${esc(c.name)}</b> à découvert de <b>${fmt(-env)}</b> : tu as dépensé plus que ce que tu y avais mis.`, act: `<button class="btn sm" data-act="move" data-to="cat:${c.id}">Combler</button>` });
    else if (base > 0 && spent > base) out.push({ lvl: 'danger', ic: '🔴', msg: `Tu as dépassé ton budget <b>${esc(c.name)}</b> de <b>${fmt(spent - base)}</b>.` });
    else if (base > 0 && spent / base >= .85) out.push({ lvl: 'warn', ic: '⚠️', msg: `Ton budget <b>${esc(c.name)}</b> est déjà consommé à <b>${pct(spent, base)} %</b>.` });
  });
  S.debts.forEach(d => { const n = debtNext(d, C); if (n && n.inDays <= 5) out.push({ lvl: n.inDays < 0 ? 'danger' : 'warn', ic: '💳', msg: n.inDays < 0 ? `Échéance <b>${esc(d.label)}</b> de <b>${fmt(n.amount)}</b> en retard de ${-n.inDays} jour(s).` : `Une échéance de <b>${fmt(n.amount)}</b> (${esc(d.label)}) arrive ${n.inDays === 0 ? "aujourd'hui" : 'dans ' + n.inDays + ' jour(s)'}.`, act: `<button class="btn sm" data-act="debtPay" data-id="${d.id}">Rembourser</button>` }); });
  S.goals.forEach(g => { const gi = goalInfo(g, C.goal[g.id] || 0);

    else if (gi.status === 'ahead') out.push({ lvl: 'ok', ic: '🎯', msg: `Tu es en avance sur ton objectif <b>${esc(g.name)}</b>.` });
    else if (gi.status === 'behind') out.push({ lvl: 'warn', ic: '🎯', msg: `Tu es en retard sur <b>${esc(g.name)}</b> : il faudrait <b>${fmt(gi.monthly)}/mois</b>.` });
  });
  if (sbEnabled() && !SB.session) out.push({ lvl: 'info', ic: '☁️', msg: 'Crée ton compte pour retrouver tes données automatiquement sur tous tes appareils.', act: `<button class="btn sm primary" data-act="login">Se connecter</button>` });
  if (!(sbEnabled() && SB.session) && S.tx.length >= 10 && (!S.lastExport || daysBetween(S.lastExport, today()) > 30)) out.push({ lvl: 'info', ic: '💾', msg: `Pense à exporter une sauvegarde de tes données (dernière : ${S.lastExport ? fmtDate(S.lastExport) : 'jamais'}).`, act: `<button class="btn sm" data-act="export">Sauvegarder</button>` });
  return out;
}

function txMeta(t) {
  const a = accById(t.accountId); const an = a ? a.icon + ' ' + a.name : '—';
  if (t.type === 'income') { const c = catById(t.catId); return { ic: c ? c.icon : '📥', title: t.label || (c ? c.name : 'Rentrée'), sub: (c ? c.name : '') + ' · ' + (a ? a.name : ''), sign: 1, cat: c ? c.name : 'Rentrée', acc: an }; }
  if (t.type === 'expense') { if (t.goalId) { const g = goalById(t.goalId); return { ic: g ? g.icon || '🎯' : '🎯', title: t.label || (g ? g.name : 'Dépense'), sub: 'Objectif ' + (g ? g.name : '') + ' · ' + (a ? a.name : ''), sign: -1, cat: 'Objectif ' + (g ? g.name : ''), acc: an }; } const c = catById(t.catId); return { ic: c ? c.icon : '📤', title: t.label || (c ? c.name : 'Dépense'), sub: (c ? c.name : 'Sans ligne') + ' · ' + (a ? a.name : ''), sign: -1, cat: c ? c.name : 'Sans ligne', acc: an }; }
  if (t.type === 'transfer') { const b = accById(t.toAccountId); return { ic: '⇄', title: t.label || 'Transfert', sub: (a ? a.name : '?') + ' → ' + (b ? b.name : '?'), sign: 0, cat: 'Transfert', acc: (a ? a.name : '?') + ' → ' + (b ? b.name : '?') }; }
  if (t.type === 'debt') { const d = debtById(t.debtId); return { ic: '💳', title: t.label || 'Remboursement ' + (d ? d.label : ''), sub: 'Dette · ' + (a ? a.name : ''), sign: -1, cat: 'Dette ' + (d ? d.label : ''), acc: an }; }
  if (t.type === 'adjust') return { ic: '🔧', title: t.label || 'Ajustement de solde', sub: a ? a.name : '', sign: Math.sign(num(t.amount)), cat: 'Ajustement', acc: an };
  return { ic: '•', title: t.label, sub: '', sign: 0, cat: '', acc: an };
}
function txRow(t, actions) {
  const x = txMeta(t); const a = Math.abs(num(t.amount));
  return `<div class="li"><div class="ic">${esc(x.ic)}</div><div class="main-t"><b>${esc(x.title)}</b><span>${fmtDate(t.date).replace(/ \d{4}$/, '')} · ${esc(x.sub)}</span></div><div class="amt num ${x.sign > 0 ? 'pos' : ''}">${x.sign > 0 ? '+' : x.sign < 0 ? '−' : ''}${fmt(a)}</div>${actions ? `<button class="icon-btn no-print" data-act="txEdit" data-id="${t.id}" title="Modifier">✏️</button><button class="icon-btn no-print" data-act="txDel" data-id="${t.id}" title="Supprimer">🗑️</button>` : ''}</div>`;
}

// Tableau des opérations : date, motif, catégorie, compte, montant
function txTable(list) {
  const TYPE = { income: 'Revenu', expense: 'Dépense', transfer: 'Transfert', debt: 'Dette', adjust: 'Ajustement' };

  ${list.map(t => { const x = txMeta(t); const a = Math.abs(num(t.amount)); const d = new Date(t.date + 'T00:00:00');
    return `<tr><td class="tx-date"><b>${d.getDate()}</b> <span>${cap(d.toLocaleDateString('fr-FR', { month: 'short' }).replace('.', ''))}</span><div class="small faint">${cap(d.toLocaleDateString('fr-FR', { weekday: 'short' }).replace('.', ''))}</div></td>
    <td><div class="tx-motif"><span class="tx-ic">${esc(x.ic)}</span><div><b>${t.label ? esc(t.label) : `<i class="faint">${esc(x.title)}</i>`}</b><div class="small faint">${TYPE[t.type] || ''}<span class="m-only"> · ${esc(x.cat)} · ${esc(x.acc)}</span></div></div></div></td>
    <td class="d-only">${esc(x.cat)}</td><td class="d-only">${esc(x.acc)}</td>
    <td class="r num"><b class="${x.sign > 0 ? 'pos' : ''}">${x.sign > 0 ? '+' : x.sign < 0 ? '−' : ''}${fmt(a)}</b></td>

  </tbody></table></div>`;
}

      <div class="kpi"><div class="k">Affecté ce mois</div><div class="v num">${fmt(ta)}</div></div>

function pTransactions(C) {
  const m = ui.month; const f = ui.txFilter; const q = ui.search.trim().toLowerCase();
  let list = S.tx.filter(t => mKey(t.date) === m);
  if (f !== 'all') list = list.filter(t => t.type === f);
  if (q) list = list.filter(t => { const x = txMeta(t); return (x.title + ' ' + x.sub + ' ' + (t.label || '')).toLowerCase().includes(q); });
  list.sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id));
  const days = []; list.forEach(t => { if (!days.includes(t.date)) days.push(t.date); });
  const tin = list.filter(t => t.type === 'income').reduce((s, t) => s + num(t.amount), 0);
  const tout = list.filter(t => t.type === 'expense' || t.type === 'debt').reduce((s, t) => s + num(t.amount), 0);
  const allocs = S.alloc.filter(x => mKey(x.date) === m).sort((a, b) => b.date.localeCompare(a.date));
  const filters = [['all', 'Tout'], ['income', 'Revenus'], ['expense', 'Dépenses'], ['transfer', 'Transferts'], ['debt', 'Dettes'], ['adjust', 'Ajustements'], ['alloc', 'Répartitions']];
  return `<div class="page-head"><div><h1>Transactions</h1><p>Toutes tes opérations au même endroit.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap">${monthNav('month')}<button class="btn" data-act="csv">⬇️ CSV</button></div></div>
  <div class="card">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:6px">
      <div class="chips">${filters.map(([k, l]) => `<button class="chip ${f === k ? 'on' : ''}" data-act="txFilter" data-k="${k}">${l}</button>`).join('')}</div>
      <input type="text" placeholder="🔎 Rechercher…" value="${esc(ui.search)}" data-bind="search" style="max-width:240px">
    </div>
    ${f === 'alloc' ? `<p class="small muted">Chaque répartition déplace de l'argent « non affecté » vers une enveloppe, un objectif ou une dette (sans toucher aux comptes).</p>
      <div class="list">${allocs.map(x => `<div class="li"><div class="ic">${num(x.amount) >= 0 ? '➡️' : '⬅️'}</div><div class="main-t"><b>${esc(targetLabel(x.t, x.id))}</b><span>${fmtDate(x.date)}${x.note ? ' · ' + esc(x.note) : ''}${x.txId ? ' · rentrée' : ''}</span></div><div class="amt num">${fmtS(num(x.amount))}</div><button class="icon-btn" data-act="allocDel" data-id="${x.id}" title="Annuler">🗑️</button></div>`).join('') || empty('📐', 'Aucune répartition ce mois-ci.')}</div>`
    : `<div class="small muted" style="margin:8px 0">${list.length} opération(s) · Entrées <b class="pos num">${fmt(tin)}</b> · Sorties <b class="num">${fmt(tout)}</b></div>
      ${list.length ? txTable(list) : empty('🧾', 'Aucune opération pour ce mois.', '<button class="btn primary" data-act="quick">＋ Nouvelle opération</button>')}`}
  </div>`;
}

function pObjectifs(C) {
  const sav = S.goals.filter(g => g.kind !== 'investissement'), inv = S.goals.filter(g => g.kind === 'investissement');
  const tot = l => l.reduce((s, g) => s + pos(C.goal[g.id] || 0), 0);
  const card = g => {
    const bal = C.goal[g.id] || 0; const gi = goalInfo(g, bal);
    const tag = { done: '<span class="tag ok">Atteint 🎉</span>', ahead: '<span class="tag ok">En avance</span>', ontrack: '<span class="tag">Dans les temps</span>', behind: '<span class="tag warn">En retard</span>', late: '<span class="tag danger">Échéance passée</span>' }[gi.status] || '';
    return `<div class="card gcard"><div class="top"><div class="ic">${esc(g.icon || '🎯')}</div><div style="flex:1;min-width:0"><h3>${esc(g.name)}</h3><div class="small muted">${g.kind === 'investissement' ? 'Investissement' : 'Épargne'}${g.deadline ? ' · pour le ' + fmtDate(g.deadline) : ''}</div></div>${tag}</div>
      <div class="nums"><span class="big num">${fmt(bal)}</span>${gi.target ? `<span class="muted num">/ ${fmt(gi.target)}</span>` : '<span class="muted small">Sans montant cible</span>'}</div>
      ${gi.target ? progress(gi.p, 'lg') + `<div class="meta"><span>${gi.p} %</span><span>Reste ${fmt(gi.rest)}</span></div>` : ''}
      ${gi.target && g.deadline && gi.rest > 0 ? `<div class="tip">🧮 Tu dois mettre <b class="num">${fmt(Math.ceil(gi.monthly))}/mois</b> pendant ${gi.months} mois pour l'atteindre.</div>` : ''}
      <div class="acts"><button class="btn sm primary" data-act="move" data-to="goal:${g.id}">＋ Ajouter</button><button class="btn sm" data-act="move" data-from="goal:${g.id}" data-to="free">Retirer</button><button class="btn sm" data-act="expense" data-goal="${g.id}">Utiliser</button><button class="btn sm ghost" data-act="goalEdit" data-id="${g.id}">✏️ Modifier</button></div></div>`;
  };
  return `<div class="page-head"><div><h1>Épargne & objectifs</h1><p>Ton épargne est de l'argent mis de côté sur tes comptes, protégé de tes dépenses.</p></div><button class="btn primary" data-act="goalEdit">＋ Nouvel objectif</button></div>
  <div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:16px">
    <div class="kpi"><div class="k">💰 Total épargné</div><div class="v num">${fmt(tot(sav))}</div></div>
    <div class="kpi"><div class="k">📈 Total investi</div><div class="v num">${fmt(tot(inv))}</div></div>
    <div class="kpi"><div class="k">🧮 Effort mensuel conseillé</div><div class="v num">${fmt(S.goals.reduce((s, g) => s + goalInfo(g, C.goal[g.id] || 0).monthly, 0))}</div></div></div>
  ${S.goals.length ? `<div class="grid g2">${sav.concat(inv).map(card).join('')}</div>` : `<div class="card">${empty('🎯', 'Crée ton premier objectif : fonds d\'urgence, voyage, ordinateur…', '<button class="btn primary" data-act="goalEdit">＋ Nouvel objectif</button>')}</div>`}`;
}

function pDettes(C) {
  const list = S.debts.filter(d => !d.archived);
  const totalInit = list.reduce((s, d) => s + num(d.initial), 0); const totalPaid = list.reduce((s, d) => s + C.dPaid[d.id], 0);
  const card = d => {
    const rem = C.remaining[d.id]; const paid = C.dPaid[d.id]; const p = pct(paid, num(d.initial)); const n = debtNext(d, C); const prov = C.dEnv[d.id] || 0;
    const history = S.tx.filter(t => t.type === 'debt' && t.debtId === d.id).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 3);
    return `<div class="card gcard"><div class="top"><div class="ic">${esc((d.type || '💳').split(' ')[0])}</div><div style="flex:1;min-width:0"><h3>${esc(d.label)}</h3><div class="small muted">${esc((d.type || '').replace(/^\S+\s/, ''))}${d.creditor ? ' · ' + esc(d.creditor) : ''}</div></div>${rem <= 0 ? '<span class="tag ok">Soldée 🎉</span>' : ''}</div>
      <div class="row3 small" style="gap:8px"><div><div class="muted">Montant initial</div><b class="num">${fmt(num(d.initial))}</b></div><div><div class="muted">Remboursé</div><b class="num pos">${fmt(paid)}</b></div><div><div class="muted">Restant</div><b class="num">${fmt(rem)}</b></div></div>
      <div style="margin-top:12px">${progress(p, 'lg')}</div><div class="meta"><span>${p} % remboursé</span>${d.dueDate ? `<span>Fin prévue : ${fmtDate(d.dueDate)}</span>` : ''}</div>
      ${n ? `<div class="tip">📅 Prochain paiement : <b class="num">${fmt(n.amount)}</b> le ${fmtDate(n.date)}${n.inDays >= 0 ? ` (dans ${n.inDays} j)` : ' <b class="neg">en retard</b>'}.<br>Après ce paiement : <b class="num">${fmt(n.after)}</b> restant.${prov > 0 ? `<br>💼 Provision mise de côté : <b class="num">${fmt(prov)}</b>` : ''}</div>` : ''}
      ${history.length ? `<div class="small muted" style="margin-top:10px">Derniers remboursements : ${history.map(t => fmtN(num(t.amount)) + ' (' + fmtDate(t.date).replace(/ \d{4}$/, '') + ')').join(' · ')}</div>` : ''}
      <div class="acts">${rem > 0 ? `<button class="btn sm primary" data-act="debtPay" data-id="${d.id}">Rembourser</button><button class="btn sm" data-act="move" data-to="debt:${d.id}">Provisionner</button>` : prov > 0 ? `<button class="btn sm" data-act="move" data-from="debt:${d.id}" data-to="free">Libérer la provision</button>` : ''}<button class="btn sm ghost" data-act="debtEdit" data-id="${d.id}">✏️ Modifier</button></div></div>`;
  };
  return `<div class="page-head"><div><h1>Mes dettes</h1><p>Suis chaque dette, ses échéances et ta progression.</p></div><button class="btn primary" data-act="debtEdit">＋ Nouvelle dette</button></div>
  <div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:16px">
    <div class="kpi"><div class="k">Total emprunté</div><div class="v num">${fmt(totalInit)}</div></div>
    <div class="kpi"><div class="k">Déjà remboursé</div><div class="v num pos">${fmt(totalPaid)}</div><div class="d muted">${pct(totalPaid, totalInit)} %</div></div>
    <div class="kpi"><div class="k">Reste à rembourser</div><div class="v num">${fmt(C.debtTotal)}</div></div></div>
  ${list.length ? `<div class="grid g2">${list.map(card).join('')}</div>` : `<div class="card">${empty('🎉', 'Aucune dette enregistrée.', '<button class="btn primary" data-act="debtEdit">＋ Nouvelle dette</button>')}</div>`}`;
}

function pRapports(C) {
  const m = ui.reportMonth; const st = monthStats(m); const pv = monthStats(addMonth(m, -1));
  const delta = (a, b, inv) => { if (!b) return '<div class="d faint">—</div>'; const d = (a - b) / b * 100; const good = inv ? d <= 0 : d >= 0; return `<div class="d ${good ? 'pos' : 'neg'}">${d >= 0 ? '+' : ''}${d.toFixed(1).replace('.', ',')} % vs ${monthShort(addMonth(m, -1))}</div>`; };
  // dépenses par catégorie
  const cats = Object.entries(st.byCat).map(([k, v]) => { if (k.startsWith('g:')) { const g = goalById(k.slice(2)); return { name: (g ? (g.icon || '🎯') + ' ' + g.name : 'Objectif'), v }; } const c = catById(k); return { name: c ? c.icon + ' ' + c.name : 'Sans ligne', v }; });
  if (st.debt) cats.push({ name: '💳 Dettes', v: st.debt });
  cats.sort((a, b) => b.v - a.v);
  const maxC = Math.max(1, ...cats.map(c => c.v));
  // 6 mois
  const months = []; for (let i = 5; i >= 0; i--) months.push(addMonth(m, -i));
  const series = months.map(mm => { const s = monthStats(mm); return { m: mm, inc: s.income, out: s.expense + s.debt }; });
  const maxV = Math.max(1, ...series.map(s => Math.max(s.inc, s.out)));
  const W = 600, H = 220, padL = 8, padB = 26, chartH = H - padB - 10, step = (W - padL * 2) / series.length, bw = Math.min(28, step / 3);
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenus et sorties sur 6 mois">
    ${[0, .5, 1].map(f => `<line class="gl" x1="0" x2="${W}" y1="${10 + chartH * (1 - f)}" y2="${10 + chartH * (1 - f)}"/>`).join('')}
    ${series.map((s, i) => { const x = padL + step * i + step / 2; const hi = s.inc / maxV * chartH, ho = s.out / maxV * chartH; const base = 10 + chartH;
      const r = (x0, h, cls) => h > 0 ? `<path class="${cls}" d="M${x0},${base} v${-Math.max(0, h - 4)} q0,-4 4,-4 h${bw - 8} q4,0 4,4 v${Math.max(0, h - 4)} z"/>` : '';
      return `${r(x - bw - 1, hi, 'bi')}${r(x + 1, ho, 'be')}<text x="${x}" y="${H - 6}" text-anchor="middle" ${s.m === m ? 'style="font-weight:700;fill:var(--text)"' : ''}>${monthShort(s.m)}</text>
      <rect class="hit" x="${x - step / 2}" y="0" width="${step}" height="${base}" data-tip="${monthLabel(s.m)}&#10;Revenus : ${fmt(s.inc)}&#10;Sorties : ${fmt(s.out)}&#10;Solde : ${fmtS(s.inc - s.out)}"/>`; }).join('')}
  </svg>`;
  // Observations
  const obs = [];
  if (st.income) obs.push(['💰', `Tu as épargné et investi <b>${pct(st.savings + st.invest, st.income)} %</b> de tes revenus (${fmt(st.savings + st.invest)}).`]);
  expCats().forEach(c => { const p = planned(c, m, st) || (st.allocCat[c.id] || 0); const s = st.byCat[c.id] || 0; if (p > 0 && s > p) obs.push(['🔴', `Ton budget <b>${esc(c.name)}</b> a été dépassé de <b>${fmt(s - p)}</b>.`]); });
  expCats().forEach(c => { const a = st.byCat[c.id] || 0, b = pv.byCat[c.id] || 0; if (b >= 5000 && Math.abs(a - b) / b >= .1 && (m < curMonth() || a > b)) obs.push([a < b ? '📉' : '📈', `Tes dépenses <b>${esc(c.name)}</b> ont ${a < b ? 'diminué' : 'augmenté'} de <b>${Math.round(Math.abs(a - b) / b * 100)} %</b> par rapport au mois précédent.`]); });
  if (st.debt) obs.push(['💳', `Tu as remboursé <b>${fmt(st.debt)}</b> de dettes.`]);
  if (st.income && st.left > 0) obs.push(['✅', `Il te reste <b>${fmt(st.left)}</b> de ce mois après dépenses, épargne et dettes.`]);
  if (st.income && st.left < 0) obs.push(['⚠️', `Tu as dépensé <b>${fmt(-st.left)}</b> de plus que ce que tu as gagné ce mois-ci.`]);
  const incCatsL = Object.entries(st.incByCat).map(([k, v]) => { const c = catById(k); return { name: c ? c.icon + ' ' + c.name : 'Autre', v }; }).sort((a, b) => b.v - a.v);
  return `<div class="page-head"><div><h1>Rapports</h1><p>Bilan de ${monthLabel(m)}</p></div><div style="display:flex;gap:8px;flex-wrap:wrap" class="no-print">${monthNav('reportMonth')}<button class="btn" data-act="print">🖨️ PDF</button></div></div>
  <div class="kpis" style="margin-bottom:16px">
    <div class="kpi"><div class="k">📥 Revenus</div><div class="v num">${fmt(st.income)}</div>${delta(st.income, pv.income)}</div>
    <div class="kpi"><div class="k">📤 Dépenses</div><div class="v num">${fmt(st.expense)}</div>${delta(st.expense, pv.expense, true)}</div>
    <div class="kpi"><div class="k">💰 Épargne</div><div class="v num">${fmt(st.savings)}</div>${delta(st.savings, pv.savings)}</div>
    <div class="kpi"><div class="k">📈 Investissement</div><div class="v num">${fmt(st.invest)}</div>${delta(st.invest, pv.invest)}</div>
    <div class="kpi"><div class="k">💳 Dettes remb.</div><div class="v num">${fmt(st.debt)}</div>${delta(st.debt, pv.debt)}</div>
    <div class="kpi"><div class="k">💸 Reste</div><div class="v num ${st.left < 0 ? 'neg' : ''}">${fmt(st.left)}</div></div></div>
  <div class="grid g2">
    <div class="card"><div class="card-head"><h2>🧠 Ce que RÉPARTI remarque</h2></div>${obs.map(([i, t]) => `<div class="insight"><span>${i}</span><div>${t}</div></div>`).join('') || '<div class="muted">Pas encore assez de données ce mois-ci.</div>'}</div>
    <div class="card chart"><div class="card-head"><h2>Revenus vs sorties — 6 mois</h2></div>
      <div class="legend"><span><i class="dot" style="background:var(--s-income)"></i>Revenus</span><span><i class="dot" style="background:var(--s-expense)"></i>Sorties (dépenses + dettes)</span></div>${svg}
      <details class="small" style="margin-top:8px"><summary class="muted" style="cursor:pointer">Voir le tableau</summary><table class="tbl"><thead><tr><th>Mois</th><th class="r">Revenus</th><th class="r">Sorties</th></tr></thead><tbody>${series.map(s => `<tr><td>${monthLabel(s.m)}</td><td class="r num">${fmtN(s.inc)}</td><td class="r num">${fmtN(s.out)}</td></tr>`).join('')}</tbody></table></details></div>
    <div class="card"><div class="card-head"><h2>Analyse des dépenses</h2><span class="muted small num">${fmt(st.expense + st.debt)}</span></div>
      ${cats.map(c => `<div class="hbar" data-tip="${esc(c.name)} : ${fmt(c.v)} (${pct(c.v, st.expense + st.debt)} %)"><span class="t">${esc(c.name)}</span><div class="track"><i style="width:${c.v / maxC * 100}%"></i></div><b class="num small">${fmtN(c.v)}</b></div>`).join('') || '<div class="muted">Aucune dépense ce mois-ci.</div>'}</div>
    <div class="card"><div class="card-head"><h2>Sources de revenus</h2></div>
      ${incCatsL.map(c => `<div class="hbar" data-tip="${esc(c.name)} : ${fmt(c.v)}"><span class="t">${esc(c.name)}</span><div class="track"><i style="width:${c.v / Math.max(1, incCatsL[0].v) * 100}%"></i></div><b class="num small">${fmtN(c.v)}</b></div>`).join('') || '<div class="muted">Aucun revenu ce mois-ci.</div>'}</div>
  </div>`;
}

function pParametres(C) {
  const ok = Math.abs(C.total - (C.affected + C.available)) < 1;
  return `<div class="page-head"><div><h1>Paramètres</h1><p>Profil, sauvegardes et personnalisation.</p></div></div>
  <div class="grid g2">
    <div class="card"><h2 style="margin-bottom:14px">👤 Profil</h2>
      <label class="fld"><span>Prénom</span><input type="text" value="${esc(S.user.name)}" data-bind="userName"></label>
      <label class="fld"><span>Devise</span><select data-bind="currency">${CURRENCIES.concat(CURRENCIES.includes(S.user.currency) ? [] : [S.user.currency]).map(c => `<option ${c === S.user.currency ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
      <label class="fld"><span>Apparence</span><select data-bind="theme"><option value="">Automatique</option><option value="light" ${S.theme === 'light' ? 'selected' : ''}>Clair</option><option value="dark" ${S.theme === 'dark' ? 'selected' : ''}>Sombre</option></select></label></div>
    <div class="card"><h2 style="margin-bottom:6px">💾 Mes données</h2>
      <p class="small" style="margin-top:0;font-weight:650" data-sync>${syncLabel()}</p>
      ${!sbEnabled() && !CLOUD.ready && window.top === window.self && /^https?:$/.test(location.protocol) ? `<div class="alert warn"><span class="a-ic">⚠️</span><div class="a-body">Connexion par e-mail non configurée : ${window.REPARTI_CONFIG ? 'le fichier <b>config.js</b> est trouvé mais incomplet (adresse ou clé manquante).' : 'le fichier <b>config.js</b> est introuvable à côté de reparti.html.'}</div></div>` : ''}
      ${sbEnabled() ? (SB.session ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><button class="btn sm" data-act="syncNow">🔄 Synchroniser maintenant</button><button class="btn sm" data-act="logout">Se déconnecter</button></div>` : `<div style="margin-bottom:12px"><button class="btn primary sm" data-act="login">☁️ Se connecter / créer un compte</button></div>`) : ''}
      <p class="small muted" style="margin-top:0">${sbEnabled() && SB.session ? "Connecte-toi avec le même compte sur ton ordinateur, ta tablette et ton téléphone : chaque modification est envoyée automatiquement. L'export reste utile comme copie de sécurité." : CLOUD.ready ? "Tu retrouves tes données sur tous tes appareils en ouvrant ce lien avec ton compte. Elles sont privées : personne d'autre ne peut les voir." : 'Tes données restent dans ce navigateur. Exporte régulièrement une sauvegarde (fichier .json) pour la conserver ou la transférer sur un autre appareil.'}</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="export">⬇️ Exporter une sauvegarde</button><button class="btn" data-act="import">⬆️ Restaurer</button><button class="btn" data-act="csv">📄 Export CSV (Excel)</button></div>
      <p class="small muted">Dernière sauvegarde : ${S.lastExport ? fmtDate(S.lastExport) : 'jamais'}</p>
      <div class="alert ${ok ? 'ok' : 'danger'}"><span class="a-ic">${ok ? '✅' : '❌'}</span><div class="a-body">Contrôle de cohérence : Solde des comptes (${fmt(C.total)}) = Affecté (${fmt(C.affected)}) + Disponible (${fmt(C.available)})</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><button class="btn sm" data-act="demo">Charger les données d'exemple</button><button class="btn sm danger" data-act="reset">Tout effacer</button></div></div>
    <div class="card"><div class="card-head"><h2>📲 Installer RÉPARTI</h2></div>
      <p class="small muted" style="margin-top:0">Installe RÉPARTI comme une vraie application sur ton ordinateur, ta tablette ou ton téléphone : icône sur l'écran d'accueil, ouverture en plein écran, fonctionne hors connexion.</p>
      ${INSTALL.installed ? '<div class="alert ok"><span class="a-ic">✅</span><div class="a-body">RÉPARTI est installé sur cet appareil.</div></div>' : PWA_OK ? `<button class="btn primary" data-act="install">⬇️ Installer l'application</button>` : `<div class="alert info"><span class="a-ic">ℹ️</span><div class="a-body">L'installation est possible depuis l'adresse web officielle de RÉPARTI (pas depuis un fichier ouvert localement ni depuis claude.ai).</div></div>`}</div>
    <div class="card"><div class="card-head"><h2>💳 Libellés de dettes</h2></div>
      <div class="chips">${S.debtTypes.map((t, i) => `<span class="chip">${esc(t)} <button class="link" data-act="debtTypeDel" data-i="${i}" aria-label="Supprimer">✕</button></span>`).join('')}</div>
      <div style="display:flex;gap:8px;margin-top:12px"><input type="text" id="newDebtType" placeholder="Ex. 🏍️ Crédit moto"><button class="btn" data-act="debtTypeAdd">Ajouter</button></div></div>
    <div class="card"><div class="card-head"><h2>🗂️ Lignes & comptes</h2></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="goBudget" data-k="expense">Lignes de dépenses</button><button class="btn" data-act="goBudget" data-k="income">Lignes de revenus</button><button class="btn" data-act="goBudget" data-k="models">Modèles de répartition</button><button class="btn" data-go="comptes">Comptes</button></div>
      <p class="small muted">RÉPARTI · v1.0 — Ton argent. Tes règles. Chaque franc à sa place.</p></div>
  </div>`;
}

/* ================== RENDER ================== */
function applyTheme() { if (S && S.theme) document.documentElement.setAttribute('data-theme', S.theme); else document.documentElement.removeAttribute('data-theme'); }
function render() {
  applyTheme();
  if (!S || !S.onboarded) { renderOnboarding(); return; }
  const C = calc();
  const pages = { dashboard: pDashboard, budget: pBudget, comptes: pComptes, transactions: pTransactions, objectifs: pObjectifs, dettes: pDettes, rapports: pRapports, parametres: pParametres };
  const page = pages[ui.route] || pDashboard;
  $('#app').innerHTML = `<div class="shell">${sidebar()}<main class="main">${page(C)}</main>${bottomNav()}</div><button class="fab" data-act="quick" aria-label="Nouvelle opération" title="Nouvelle opération">＋</button>`;
}

/* ================== FORMULAIRES ================== */
async function askNewCat(kind, sel) {
  if (sel.value !== '__new') return;
  const name = await uiPrompt(kind === 'income' ? 'Nom de la nouvelle ligne de revenu (ex. Revenus TikTok) :' : 'Nom de la nouvelle ligne de dépense (ex. Voyage) :');
  if (!name || !name.trim()) { sel.selectedIndex = 0; return; }
  const c = { id: uid(), kind, name: name.trim(), icon: kind === 'income' ? '💼' : '🏷️', group: kind === 'income' ? 'Autres' : 'Projets', mode: 'variable', amount: 0, pct: 0, recurrence: 'mensuelle', accountId: '', archived: false };
  S.categories.push(c); save();
  sel.innerHTML = catOptions(kind, c.id);
}
function needAccounts() { if (!activeAccounts().length) { toast("Ajoute d'abord un compte."); go('comptes'); return true; } return false; }

// Motifs déjà utilisés (pour l'autocomplétion), du plus récent au plus ancien
function motifList(type, id) {
  const seen = []; S.tx.filter(t => t.type === type && t.label).sort((a, b) => b.date.localeCompare(a.date)).forEach(t => { if (!seen.includes(t.label) && seen.length < 40) seen.push(t.label); });
  return `<datalist id="${id}">${seen.map(v => `<option value="${esc(v)}">`).join('')}</datalist>`;
}

}

function formDebtPay(debtId, tx) {
  if (needAccounts()) return;
  const C = calc(); const debts = S.debts.filter(d => C.remaining[d.id] > 0 || (tx && d.id === tx.debtId));
  if (!debts.length) { toast('Aucune dette à rembourser.'); return; }
  const d0 = debtById(tx ? tx.debtId : debtId) || debts[0];
  const t = tx || { amount: Math.min(C.remaining[d0.id], num(d0.monthly) || C.remaining[d0.id]), debtId: d0.id, accountId: d0.accountId || (activeAccounts()[0] || {}).id, date: today(), label: '' };
  openModal(`${mh(tx ? 'Modifier le remboursement' : '💳 Rembourser une dette')}<form id="mform">

      if (tx) { Object.assign(tx, data); return commit('Remboursement modifié ✓'); }
