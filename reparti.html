function formMove(pre = {}) {
  const C = calc();
  const from = pre.from || 'free', to = pre.to || '';
  openModal(`${mh('⇄ Affecter / déplacer de l\'argent')}<form id="mform">
    <p class="small muted" style="margin-top:-6px">Change la destination de ton argent sans toucher à tes comptes.</p>
    <label class="fld"><span>Prendre depuis</span><select name="from">${targetOptions(from, { withFree: true, C })}</select></label>
    <label class="fld"><span>Mettre dans</span><select name="to">${targetOptions(to || (from === 'free' ? '' : 'free'), { withFree: true, C })}</select></label>
    <div class="row2"><label class="fld"><span>Montant (${cur()})</span><input name="amount" inputmode="decimal" required autofocus value="${pre.amount ? fmtN(pre.amount) : ''}"></label>
    <label class="fld"><span>Date</span><input type="date" name="date" value="${today()}"></label></div>
    ${mf('Valider')}</form>`, {
    async onSubmit(f) {
      const amount = num(f.amount); if (amount <= 0) return toast('Indique un montant valide.');
      if (f.from === f.to) return toast('Choisis deux destinations différentes.');
      const bal = targetBal(C, f.from);
      if (amount > bal + 0.5 && !await uiConfirm(`Il n'y a que ${fmt(bal)} dans la source. Continuer quand même ?`)) return;
      if (f.from !== 'free') addAlloc(f.from, -amount, f.date, null, 'Déplacement');
      if (f.to !== 'free') addAlloc(f.to, amount, f.date, null, 'Déplacement');
      commit('Argent réaffecté ✓');
    }
  });
}

/* ----- Répartition d'une rentrée ----- */
let AL = null;
function modelRows(md, amount) {
  const C = calc(); const rows = [];
  md.lines.forEach(l => {
    if (l.t === 'cat' && !catById(l.id)) return; if (l.t === 'goal' && !goalById(l.id)) return; if (l.t === 'debt' && !debtById(l.id)) return;
    let v = 0;
    if (l.mode === 'pct') v = amount * num(l.value) / 100;
    else if (l.mode === 'fixe') v = num(l.value);
    else if (l.mode === 'auto') { if (l.t === 'goal') v = goalInfo(goalById(l.id), C.goal[l.id] || 0).monthly; else if (l.t === 'debt') { const d = debtById(l.id); v = Math.min(C.remaining[d.id], num(d.monthly)); } else { const c = catById(l.id); v = planned(c, curMonth()); } }
    rows.push({ key: l.t + ':' + l.id, amount: Math.round(v) });
  });
  return rows;
}
function smartRows(amount, date) {
  const C = calc(); const m = mKey(date || today()); const st = monthStats(m); let left = amount; const rows = [];
  const push = (key, need) => { need = Math.round(Math.min(left, pos(need))); if (need > 0) { rows.push({ key, amount: need }); left -= need; } };
  S.debts.forEach(d => { if (C.remaining[d.id] > 0) push('debt:' + d.id, Math.min(C.remaining[d.id], num(d.monthly)) - (st.allocDebt[d.id] || 0)); });
  expCats().forEach(c => { const p = planned(c, m, st); if (p > 0) push('cat:' + c.id, p - (st.allocCat[c.id] || 0)); });
  S.goals.forEach(g => { const gi = goalInfo(g, C.goal[g.id] || 0); if (gi.monthly > 0) push('goal:' + g.id, gi.monthly - (st.allocGoal[g.id] || 0)); });
  return rows;
}
function openAllocate(opts) {
  const catId = opts.catId; let modelId = (catId && S.lastModelByCat[catId]) || (S.models[0] ? S.models[0].id : '__smart');
  if (modelId !== '__smart' && modelId !== '__none' && !S.models.find(x => x.id === modelId)) modelId = S.models[0] ? S.models[0].id : '__smart';
  AL = Object.assign({ modelId, rows: [] }, opts);
  applyAllocModel();
  renderAllocate();
}
function applyAllocModel() {
  if (AL.modelId === '__smart') AL.rows = smartRows(AL.amount, AL.date);
  else if (AL.modelId === '__none') AL.rows = [];
  else { const md = S.models.find(x => x.id === AL.modelId); AL.rows = md ? modelRows(md, AL.amount) : []; }
  const tot = AL.rows.reduce((s, r) => s + r.amount, 0); const diff = AL.amount - tot;
  if (AL.rows.length && Math.abs(diff) <= AL.rows.length) AL.rows[AL.rows.length - 1].amount += diff; // arrondis
}
function renderAllocate() {
  const used = AL.rows.map(r => r.key);
  const C = calc();
  const ts = targets().filter(x => !used.includes(x.key)); const gs = groupsOf(ts);
  const html = `${mh(AL.txId ? 'Comment veux-tu répartir cette rentrée ?' : 'Répartir mon argent non affecté')}
  <div class="alloc-top"><div><div class="muted small">Montant à répartir</div><div class="big num">${fmt(AL.amount)}</div></div>
    <label class="fld"><span>Modèle de répartition</span><select data-ch="allocModel">${S.models.map(md => `<option value="${md.id}" ${AL.modelId === md.id ? 'selected' : ''}>📐 ${esc(md.name)}</option>`).join('')}<option value="__smart" ${AL.modelId === '__smart' ? 'selected' : ''}>🧠 Selon mes budgets, objectifs & dettes</option><option value="__none" ${AL.modelId === '__none' ? 'selected' : ''}>✍️ Répartition manuelle</option></select></label></div>
  <div class="tbl-wrap"><table class="tbl alloc-table"><thead><tr><th>Ligne</th><th class="r">%</th><th class="r">Montant</th><th></th></tr></thead><tbody>
  ${AL.rows.map((r, i) => { const [t, id] = r.key.split(':'); return `<tr><td>${esc(targetLabel(t, id))}<div class="small faint">Solde actuel ${fmtN(targetBal(C, r.key))}</div></td><td class="r"><input class="pin" data-allocpct="${i}" inputmode="decimal" value="${AL.amount ? (r.amount / AL.amount * 100).toFixed(1).replace('.0', '').replace('.', ',') : 0}"></td><td class="r"><input class="ain" data-alloc="${i}" inputmode="decimal" value="${fmtN(r.amount)}"></td><td><button class="icon-btn" data-act="allocRowDel" data-i="${i}" aria-label="Retirer">✕</button></td></tr>`; }).join('') || `<tr><td colspan="4" class="muted small">Aucune ligne : ajoute des destinations ci-dessous.</td></tr>`}
  </tbody></table></div>
  <div style="margin-top:10px"><select data-ch="allocAdd"><option value="">＋ Ajouter une ligne à la répartition…</option>${gs.map(g => `<optgroup label="${esc(g)}">${ts.filter(x => x.group === g).map(x => `<option value="${x.key}">${esc(x.icon + ' ' + x.name)}</option>`).join('')}</optgroup>`).join('')}</select></div>
  <div id="allocSum"></div>
  ${AL.catId ? `<label class="check small" style="margin-top:8px"><input type="checkbox" id="allocRemember" checked> Utiliser ce modèle par défaut pour « ${esc((catById(AL.catId) || {}).name || '')} »</label>` : ''}
  <div class="mf"><button type="button" class="btn ghost left" data-act="allocSaveModel">💾 Enregistrer comme modèle</button><button type="button" class="btn ghost" data-act="allocSkip">Plus tard</button><button type="button" class="btn primary" data-act="allocConfirm">Confirmer</button></div>`;
  if (!modalCtx || !modalCtx.alloc) openModal(html, { wide: true, alloc: true });
  else $('#modal-root .modal').innerHTML = html;
  updateAllocSum();
}
function updateAllocSum() {
  const el = $('#allocSum'); if (!el) return;
  const tot = AL.rows.reduce((s, r) => s + r.amount, 0); const rest = AL.amount - tot;
  el.className = 'alloc-sum ' + (rest < -0.5 ? 'danger' : rest > 0.5 ? 'warn' : 'ok');
  el.innerHTML = `<span>Total réparti : <span class="num">${fmt(tot)}</span> (${pct(tot, AL.amount)} %)</span><span>${rest < -0.5 ? `❌ Tu répartis ${fmt(-rest)} de trop` : rest > 0.5 ? `⚠️ ${fmt(rest)} non affectés` : '✅ Chaque franc a sa place'}</span>`;
}
function confirmAlloc() {
  const tot = AL.rows.reduce((s, r) => s + r.amount, 0);
  if (tot > AL.amount + 0.5) return toast('Le total réparti dépasse le montant.');
  AL.rows.forEach(r => { if (r.amount) addAlloc(r.key, r.amount, AL.date, AL.txId, AL.txId ? 'Répartition' : 'Répartition du non affecté'); });
  const rem = $('#allocRemember'); if (AL.catId && rem && rem.checked) S.lastModelByCat[AL.catId] = AL.modelId;
  const rest = AL.amount - tot;
  commit(rest > 0.5 ? `Répartition enregistrée · ${fmt(rest)} restent non affectés` : 'Répartition enregistrée · chaque franc a sa place ✓');
  AL = null;
}

async function download(name, content, type) {

    const dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads') : null;
    if (dl) { await dl.save({ filename: name, data: content }); return true; }
  } catch (e) { if (e && e.code === 'declined') return false; if (e && e.code === 'rate_limited') { toast('Patiente un instant puis réessaie.'); return false; } }
  const b = new Blob([content], { type }); const u = URL.createObjectURL(b); const l = document.createElement('a'); l.href = u; l.download = name; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000); return true; }

  if (await download(`reparti-transactions-${today()}.csv`, '\ufeff' + lines.join('\r\n'), 'text/csv;charset=utf-8')) toast('Export CSV téléchargé ✓');

/* ================== ONBOARDING ================== */
let OB = null;
// Poids indicatifs d'un budget équilibré : servent à proposer une répartition à partir des lignes choisies.
const BUDGET_WEIGHTS = { 'Loyer': 25, 'Électricité': 3, 'Eau': 1.5, 'Internet': 2, 'Entretien': 1.5, 'Charges': 2, 'Alimentation': 12, 'Courses': 5, 'Restaurant': 3, 'Transport': 6, 'Carburant': 4, 'Téléphone': 2,
  'Santé': 3, 'Beauté': 2, 'Vêtements': 3, 'Sport': 1.5, 'Loisirs': 4, 'Parents': 5, 'Enfants': 6, 'Aide familiale': 3, 'Cadeaux': 2, 'Frais bancaires': 1, 'Urgences': 3, 'Imprévus': 5 };
const GOAL_CAP = 40; // au-delà, l'objectif est jugé trop ambitieux pour un budget équilibré
function initOB() {
  OB = { step: 0, name: '', currency: 'FCFA', income: '', inc: { salaire: true }, acc: {}, custom: [], cats: [], model: {}, sig: '' };
  ACCOUNT_PRESETS.forEach(p => OB.acc[p.key] = { on: ['banque', 'wave', 'om'].includes(p.key), bal: '' });
  OB.cats = makeCats('expense', EXPENSE_DEFAULTS).map(c => Object.assign(c, { on: true }));
  OB.goals = [{ id: uid(), name: "Fonds d'urgence", icon: '🛟', target: '', months: 12 }];
}
const cur0 = () => OB ? OB.currency : 'FCFA';
const obGoals = () => OB.goals.filter(g => g.name.trim());
const goalMonthly = g => num(g.target) > 0 && num(g.months) > 0 ? num(g.target) / num(g.months) : 0;
const r05 = x => Math.round(x * 2) / 2;
// Proposition équilibrée : d'abord les objectifs (selon montant et durée), puis le reste réparti
// entre les lignes de dépenses choisies selon leur poids habituel dans un budget.
function obPropose() {
  const inc = num(OB.income); const goals = obGoals(); const cats = OB.cats.filter(c => c.on);
  const model = {};
  goals.forEach(g => { const m = goalMonthly(g); model[g.id] = inc && m ? m / inc * 100 : 10; });
  let gTot = goals.reduce((s, g) => s + model[g.id], 0);
  OB.goalOver = gTot > GOAL_CAP ? gTot : 0;
  if (gTot > GOAL_CAP) { goals.forEach(g => model[g.id] *= GOAL_CAP / gTot); gTot = GOAL_CAP; }
  goals.forEach(g => model[g.id] = Math.ceil(model[g.id] * 2 - 1e-9) / 2); // arrondi au-dessus : l'objectif est atteint à temps
  gTot = goals.reduce((s, g) => s + model[g.id], 0);
  const rest = 100 - gTot; const w = c => BUDGET_WEIGHTS[c.name] || 3; const sw = cats.reduce((s, c) => s + w(c), 0) || 1;
  cats.forEach(c => model[c.id] = r05(rest * w(c) / sw));
  const keys = Object.keys(model); const diff = r05(100 - keys.reduce((s, k) => s + model[k], 0));
  if (diff && cats.length) { const big = cats.reduce((a, c) => model[c.id] > model[a.id] ? c : a, cats[0]); model[big.id] = r05(model[big.id] + diff); }
  OB.model = model;
}
function obSync() {
  const sig = JSON.stringify([OB.income, OB.cats.filter(c => c.on).map(c => c.id), obGoals().map(g => [g.id, g.target, g.months])]);
  if (sig !== OB.sig) { obPropose(); OB.sig = sig; }
}
function obRows() {
  obSync();
  const rows = []; const goals = obGoals();
  if (goals.length) rows.push({ group: '🎯 Épargne & objectifs', items: goals.map(g => ({ key: g.id, name: g.name, icon: g.icon, sub: goalMonthly(g) ? `${fmtN(num(g.target))} ${cur0()} en ${num(g.months)} mois` : 'Sans montant cible' })) });
  groupsOf(OB.cats.filter(c => c.on)).forEach(g => rows.push({ group: g, items: OB.cats.filter(c => c.on && c.group === g).map(c => ({ key: c.id, name: c.name, icon: c.icon })) }));
  return rows;
}
function obTotal() { return Math.round(Object.entries(OB.model).filter(([k]) => OB.cats.some(c => c.on && c.id === k) || obGoals().some(g => g.id === k)).reduce((s, [, v]) => s + num(v), 0) * 10) / 10; }
function obSumHTML() {
  const tot = obTotal();
  return `<span>Total : ${String(tot).replace('.', ',')} %</span><span>${tot > 100.01 ? '❌ Plus de 100 % : baisse certaines lignes' : tot < 99.99 ? String(Math.round((100 - tot) * 10) / 10).replace('.', ',') + ' % resteront non affectés' : '✅ Chaque franc a sa place'}</span>`;
}
function obRefreshSums() {
  const el = $('#obSum'); if (el) { const tot = obTotal(); el.className = 'alloc-sum ' + (tot > 100.01 ? 'danger' : tot < 99.99 ? 'warn' : 'ok'); el.innerHTML = obSumHTML(); }
  const inc = num(OB.income) || 1000000;
  document.querySelectorAll('[data-obex]').forEach(e => e.textContent = fmtN(num(OB.model[e.dataset.obex]) * inc / 100));
  document.querySelectorAll('[data-obgsum]').forEach(e => { const keys = e.dataset.obgsum.split(','); e.textContent = String(r05(keys.reduce((s, k) => s + num(OB.model[k]), 0))).replace('.', ',') + ' %'; });
}
function renderOnboarding() {
  if (!OB) initOB();
  const st = OB.step; const N = 7;
  const steps = `<div class="ob-steps">${Array.from({ length: N }, (_, i) => `<i class="${i <= st ? 'on' : ''}"></i>`).join('')}</div>`;
  let body = '';

function obGoalHint(g) {
  const m = goalMonthly(g); const inc = num(OB.income);
  if (!m) return 'Indique un montant et une durée pour que RÉPARTI calcule ton effort mensuel.';
  const d = new Date(); d.setMonth(d.getMonth() + num(g.months));
  return `🧮 Il faut mettre <b>${fmtN(Math.ceil(m))} ${cur0()}/mois</b> pour l'atteindre vers ${d.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })}${inc ? ` — soit <b>${String(Math.round(m / inc * 1000) / 10).replace('.', ',')} %</b> de ton revenu mensuel.` : '.'}`;
}
function finishOnboarding() {
  obSync();
  const s = blankState(); s.user = { name: OB.name.trim(), currency: OB.currency };
  ACCOUNT_PRESETS.forEach(p => { if (OB.acc[p.key].on) s.accounts.push({ id: uid(), name: p.name, icon: p.icon, type: p.type, initial: num(OB.acc[p.key].bal), archived: false }); });
  OB.custom.forEach(c => s.accounts.push({ id: uid(), name: c.name, icon: '🏦', type: 'autre', initial: num(c.bal), archived: false }));
  // Chaque ligne choisie reçoit son budget prévu = son pourcentage du revenu (cohérent avec la répartition).
  s.categories = OB.cats.filter(c => c.on).map(c => { const o = Object.assign({}, c); delete o.on; const p = num(OB.model[c.id]); if (p > 0) { o.mode = 'pct'; o.pct = p; } return o; });
  const wanted = new Set(['Cadeau', 'Remboursement', 'Autre']); INCOME_TYPES.forEach(([k, , names]) => { if (OB.inc[k]) names.forEach(n => wanted.add(n)); });
  if (wanted.size === 3) wanted.add('Salaire');
  s.categories = s.categories.concat(makeCats('income', INCOME_DEFAULTS, n => wanted.has(n)));
  const inc = num(OB.income); if (inc) { const sal = s.categories.find(c => c.kind === 'income' && c.name === 'Salaire'); if (sal) { sal.mode = 'fixe'; sal.amount = inc; } }
  obGoals().forEach(g => { const d = new Date(); d.setMonth(d.getMonth() + num(g.months)); s.goals.push({ id: g.id, name: g.name.trim(), icon: g.icon || '🎯', kind: 'epargne', target: num(g.target), initial: 0, deadline: num(g.target) && num(g.months) ? isoOf(d) : '', createdAt: today(), startAmount: 0 }); });
  const lines = [];
  obGoals().forEach(g => { if (num(OB.model[g.id]) > 0) lines.push({ t: 'goal', id: g.id, mode: 'pct', value: num(OB.model[g.id]) }); });
  s.categories.filter(c => c.kind === 'expense' && num(OB.model[c.id]) > 0).forEach(c => lines.push({ t: 'cat', id: c.id, mode: 'pct', value: num(OB.model[c.id]) }));
  s.models = [{ id: uid(), name: 'Salaire', lines }];
  s.onboarded = true; S = s; save(); OB = null; ui.route = 'dashboard'; render();
  toast('Bienvenue sur RÉPARTI 🎉');
}

  txEdit: el => { const t = S.tx.find(x => x.id === el.dataset.id); if (!t) return; ({ income: formIncome, expense: formExpense, transfer: formTransfer, debt: tx => formDebtPay(null, tx), adjust: () => toast('Supprime l\'ajustement puis refais-en un.') })[t.type](t); },
  txDel: async el => { const t = S.tx.find(x => x.id === el.dataset.id); if (!t) return; const linked = S.alloc.filter(a => a.txId === t.id).length;
    if (!await uiConfirm(`Supprimer cette opération (${fmt(Math.abs(num(t.amount)))}) ?${linked ? `\nSa répartition (${linked} ligne(s)) sera aussi annulée.` : ''}`)) return;
    S.tx = S.tx.filter(x => x.id !== t.id); S.alloc = S.alloc.filter(a => a.txId !== t.id); commit('Opération supprimée'); },
  allocDel: async el => { if (!await uiConfirm('Annuler cette affectation ?')) return; S.alloc = S.alloc.filter(a => a.id !== el.dataset.id); commit('Affectation annulée'); },
  allocRowDel: el => { AL.rows.splice(+el.dataset.i, 1); renderAllocate(); },
  allocSkip: () => { AL = null; closeModal(); render(); toast('Montant laissé dans « non affecté ».'); },
  allocConfirm: () => confirmAlloc(),
  allocSaveModel: async () => { const name = await uiPrompt('Nom du nouveau modèle (ex. Freelance, Prime…) :'); if (!name) return;
    const md = { id: uid(), name: name.trim(), lines: AL.rows.filter(r => r.amount > 0).map(r => { const [t, id] = r.key.split(':'); return { t, id, mode: 'pct', value: Math.round(r.amount / AL.amount * 1000) / 10 }; }) };
    S.models.push(md); AL.modelId = md.id; save(); renderAllocate(); toast('Modèle « ' + esc(md.name) + ' » enregistré ✓'); },
  catNew: el => formCat(null, el.dataset.kind),
  catEdit: el => formCat(catById(el.dataset.id)),
  catDel: el => delCat(el.dataset.id),
  modelEdit: el => openModel(el.dataset.id),
  mdRowDel: el => { MD.lines.splice(+el.dataset.i, 1); renderModel(); },
  mdSave: () => { MD.name = ($('#mdName').value || '').trim(); if (!MD.name) return toast('Donne un nom au modèle.');
    const tot = MD.lines.filter(l => l.mode === 'pct').reduce((s, l) => s + num(l.value), 0); if (tot > 100) return toast('Le total dépasse 100 %.');
    if (MD.id) { const i = S.models.findIndex(x => x.id === MD.id); S.models[i] = MD; } else { MD.id = uid(); S.models.push(MD); }
    MD = null; commit('Modèle enregistré ✓'); },
  mdDel: async () => { if (!await uiConfirm('Supprimer ce modèle ?')) return; S.models = S.models.filter(x => x.id !== MD.id); MD = null; commit('Modèle supprimé'); },
  goalEdit: el => formGoal(goalById(el.dataset.id)),
  goalDel: async el => { const g = goalById(el.dataset.id); if (!await uiConfirm(`Supprimer l'objectif « ${g.name} » ? L'argent qui y était réservé redevient non affecté.`)) return;
    S.goals = S.goals.filter(x => x.id !== g.id); S.models.forEach(md => md.lines = md.lines.filter(l => !(l.t === 'goal' && l.id === g.id))); commit('Objectif supprimé'); },
  debtEdit: el => formDebt(debtById(el.dataset.id)),
  debtDel: async el => { const d = debtById(el.dataset.id); if (!await uiConfirm(`Supprimer la dette « ${d.label} » et son historique de remboursements ?`)) return;
    S.debts = S.debts.filter(x => x.id !== d.id); S.tx = S.tx.filter(t => !(t.type === 'debt' && t.debtId === d.id)); S.alloc = S.alloc.filter(a => !(a.t === 'debt' && a.id === d.id)); S.models.forEach(md => md.lines = md.lines.filter(l => !(l.t === 'debt' && l.id === d.id))); commit('Dette supprimée'); },
  debtTypeAdd: () => { const v = ($('#newDebtType').value || '').trim(); if (!v) return; S.debtTypes.push(v); save(); render(); },
  debtTypeDel: el => { S.debtTypes.splice(+el.dataset.i, 1); save(); render(); },
  accNew: () => formAccount(),
  accEdit: el => formAccount(accById(el.dataset.id)),
  accAdjust: el => formAdjust(accById(el.dataset.id)),
  accDel: async el => { const a = accById(el.dataset.id); const used = S.tx.some(t => t.accountId === a.id || t.toAccountId === a.id);
    if (used) { if (!await uiConfirm(`« ${a.name} » a des opérations. Il sera archivé (masqué) et son solde restera compté tant qu'il n'est pas à 0. Continuer ?`)) return; a.archived = true; }
    else { if (!await uiConfirm(`Supprimer « ${a.name} » ?`)) return; S.accounts = S.accounts.filter(x => x.id !== a.id); }
    commit('Compte retiré'); },
  export: () => exportJSON(),
  import: () => $('#importFile').click(),
  csv: () => exportCSV(),
  print: () => window.print(),
  demo: async () => { if (S && S.onboarded && !await uiConfirm('Remplacer tes données par des données d\'exemple ? (Exporte d\'abord une sauvegarde si besoin.)')) return; S = demoState(); save(); ui.route = 'dashboard'; ui.month = curMonth(); render(); toast('Données d\'exemple chargées. Efface-les dans Paramètres quand tu veux commencer.'); },
  reset: async () => { if (!await uiConfirm('Effacer définitivement toutes les données de RÉPARTI sur cet appareil ?')) return; if (!await uiConfirm('Vraiment ? Cette action est irréversible.')) return; try { localStorage.removeItem(KEY); } catch (e) {} S = null; OB = null; if (CLOUD.ready) pushCloud(); if (sbEnabled() && SB.session) sbPush().catch(() => {}); render(); },
  obNext: () => { OB.step++; renderOnboarding(); window.scrollTo(0, 0); },
  obPrev: () => { OB.step = Math.max(0, OB.step - 1); renderOnboarding(); },
  obFinish: () => finishOnboarding(),
  obCat: el => { const c = OB.cats.find(x => x.id === el.dataset.id); c.on = !c.on; renderOnboarding(); },
  obAddCat: () => { const n = ($('#obNewCat').value || '').trim(); if (!n) return; const g = ($('#obNewCatG').value || '').trim() || 'Projets'; OB.cats.push({ id: uid(), kind: 'expense', name: n, icon: ICONS[n] || '🏷️', group: g, mode: 'variable', amount: 0, pct: 0, recurrence: 'mensuelle', accountId: '', archived: false, on: true }); renderOnboarding(); },
  obAddAcc: () => { const n = ($('#obNewAcc').value || '').trim(); if (!n) return; OB.custom.push({ name: n, bal: '' }); renderOnboarding(); },
  obCustomDel: el => { OB.custom.splice(+el.dataset.i, 1); renderOnboarding(); },
  login: () => formLogin(1),
  loginResend: async () => { const id = modalCtx && modalCtx.ident; if (!id) return; try { await sbFetch('/auth/v1/otp' + sbRedirect(), { method: 'POST', auth: false, body: Object.assign({ create_user: true }, id) }); toast('Nouveau code envoyé ✓ — utilise ce nouveau code'); } catch (e) { sbShowErr(sbErr(e, 'send')); } },
  logout: () => sbLogout(),
  syncNow: () => { sbSync(); toast('Synchronisation…'); },
  obGoalAdd: () => { OB.goals.push({ id: uid(), name: '', icon: '🎯', target: '', months: 12 }); renderOnboarding(); const ins = document.querySelectorAll('[data-obgoal$=":name"]'); ins[ins.length - 1].focus(); },
  obGoalDel: el => { OB.goals = OB.goals.filter(g => g.id !== el.dataset.id); renderOnboarding(); },
  obRebalance: () => { OB.sig = ''; renderOnboarding(); toast('Proposition équilibrée rétablie'); },
};
document.addEventListener('click', e => {
  const ov = e.target.closest('[data-overlay]'); if (ov && e.target === ov) { closeModal(); return; }
  const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
  const a = e.target.closest('[data-act]'); if (a && ACT[a.dataset.act]) { e.preventDefault(); ACT[a.dataset.act](a); }
});
document.addEventListener('submit', e => { if (e.target.getAttribute('id') === 'mform') { e.preventDefault(); const f = {}; new FormData(e.target).forEach((v, k) => f[k] = v); if (modalCtx && modalCtx.onSubmit) modalCtx.onSubmit(f, e.target); } });
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (DLG) DLG.done(DLG.input ? null : false); else if (modalCtx) closeModal(); });
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'importFile') { if (t.files[0]) importJSON(t.files[0]); t.value = ''; return; }
  if (t.dataset.newcat) { await askNewCat(t.dataset.newcat, t); updateEnvHint(); return; }
  if (t.dataset.ch === 'allocModel') { AL.modelId = t.value; applyAllocModel(); renderAllocate(); return; }
  if (t.dataset.ch === 'allocAdd') { if (t.value) { AL.rows.push({ key: t.value, amount: 0 }); renderAllocate(); const ins = document.querySelectorAll('[data-alloc]'); const last = ins[ins.length - 1]; if (last) { last.focus(); last.select(); } } return; }
  if (t.dataset.ch === 'mdAdd') { if (t.value) { const [tt, id] = t.value.split(':'); MD.name = ($('#mdName').value || MD.name); MD.lines.push({ t: tt, id, mode: 'pct', value: 0 }); renderModel(); } return; }
  if (t.dataset.mdmode != null) { MD.name = ($('#mdName').value || MD.name); MD.lines[+t.dataset.mdmode].mode = t.value; MD.lines[+t.dataset.mdmode].value = 0; renderModel(); return; }
  if (t.dataset.ch === 'catMode') { syncCatMode(); return; }
  if (t.dataset.ch === 'debtType' && t.value === '__new') { const v = await uiPrompt('Nouveau libellé de dette (ex. 🏍️ Crédit moto) :'); if (v && v.trim()) { S.debtTypes.push(v.trim()); save(); const o = document.createElement('option'); o.textContent = v.trim(); o.selected = true; t.insertBefore(o, t.lastElementChild); } else t.selectedIndex = 0; return; }
  if (t.dataset.bind === 'currency') { S.user.currency = t.value; save(); render(); return; }
  if (t.dataset.bind === 'theme') { S.theme = t.value; save(); render(); return; }
  if (t.dataset.ob === 'currency') { OB.currency = t.value; return; }
  if (t.dataset.obinc) { OB.inc[t.dataset.obinc] = t.checked; renderOnboarding(); return; }
  if (t.dataset.obacc) { OB.acc[t.dataset.obacc].on = t.checked; renderOnboarding(); return; }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.bind === 'search') { ui.search = t.value; const pos0 = t.selectionStart; render(); const s = $('[data-bind=search]'); if (s) { s.focus(); s.setSelectionRange(pos0, pos0); } return; }
  if (t.dataset.bind === 'userName') { S.user.name = t.value; save(); return; }
  if (t.dataset.alloc != null) { AL.rows[+t.dataset.alloc].amount = Math.round(num(t.value)); const p = t.closest('tr').querySelector('[data-allocpct]'); if (p) p.value = AL.amount ? (AL.rows[+t.dataset.alloc].amount / AL.amount * 100).toFixed(1).replace('.0', '').replace('.', ',') : 0; updateAllocSum(); return; }
  if (t.dataset.allocpct != null) { const r = AL.rows[+t.dataset.allocpct]; r.amount = Math.round(AL.amount * num(t.value) / 100); const a = t.closest('tr').querySelector('[data-alloc]'); if (a) a.value = fmtN(r.amount); updateAllocSum(); return; }
  if (t.dataset.mdval != null) { const l = MD.lines[+t.dataset.mdval]; l.value = num(t.value); const tot = MD.lines.filter(x => x.mode === 'pct').reduce((s, x) => s + num(x.value), 0); const el = $('#mdSum'); if (el) { el.className = 'alloc-sum ' + (tot > 100 ? 'danger' : tot === 100 ? 'ok' : 'warn'); el.innerHTML = `<span>Total des pourcentages : ${Math.round(tot * 10) / 10} %</span><span>${tot > 100 ? '❌ Plus de 100 %' : tot < 100 ? `${Math.round((100 - tot) * 10) / 10} % resteront non affectés` : '✅ 100 %'}</span>`; } return; }
  if (t.hasAttribute('data-envcheck')) { updateEnvHint(); return; }
  if (t.hasAttribute('data-goalcalc')) { updateGoalHint(null); return; }
  if (t.dataset.ob === 'name') { OB.name = t.value; return; }
  if (t.dataset.ob === 'income') { OB.income = t.value; return; }
  if (t.dataset.obbal) { OB.acc[t.dataset.obbal].bal = t.value; return; }
  if (t.dataset.obcbal != null) { OB.custom[+t.dataset.obcbal].bal = t.value; return; }
  if (t.dataset.obpct) { OB.model[t.dataset.obpct] = num(t.value); obRefreshSums(); return; }
  if (t.dataset.obgoal) { const [id, f] = t.dataset.obgoal.split(':'); const g = OB.goals.find(x => x.id === id); g[f] = t.value; const h = document.querySelector(`[data-obghint="${id}"]`); if (h) h.innerHTML = obGoalHint(g); return; }
});
// Infobulles
const tip = $('#tip');
document.addEventListener('mousemove', e => { const el = e.target.closest('[data-tip]'); if (!el) { tip.style.display = 'none'; return; } tip.textContent = el.getAttribute('data-tip'); tip.style.display = 'block'; const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8); tip.style.left = x + 'px'; tip.style.top = (e.clientY + 14) + 'px'; });
// Format des montants à la sortie du champ
document.addEventListener('focusout', e => { const t = e.target; if (t.matches && t.matches('input[inputmode=decimal]:not(.pin)') && !t.dataset.obpct && t.value && !t.dataset.mdval) { const n = num(t.value); if (n) t.value = fmtN(n); } });

/* ================== APPLICATION INSTALLABLE (PWA) ================== */
// Actif uniquement quand RÉPARTI est servi depuis son site (https), pas en fichier local ni dans claude.ai.
const PWA_OK = /^https?:$/.test(location.protocol) && !/(^|\.)claude\.ai$|claudeusercontent/.test(location.hostname) && 'serviceWorker' in navigator && window.top === window.self;
const INSTALL = { prompt: null, installed: window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true };
if (PWA_OK) {
  const add = (rel, href, extra) => { const l = document.createElement('link'); l.rel = rel; l.href = href; Object.assign(l, extra || {}); document.head.appendChild(l); };
  add('manifest', 'manifest.webmanifest'); add('apple-touch-icon', 'icons/apple-touch-icon.png'); add('icon', 'icons/icon-192.png', { type: 'image/png' });
  [['apple-mobile-web-app-capable', 'yes'], ['mobile-web-app-capable', 'yes'], ['apple-mobile-web-app-title', 'RÉPARTI'], ['apple-mobile-web-app-status-bar-style', 'default']].forEach(([n, c]) => { const m = document.createElement('meta'); m.name = n; m.content = c; document.head.appendChild(m); });
  navigator.serviceWorker.register('sw.js').catch(e => console.warn('sw', e));
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); INSTALL.prompt = e; document.querySelectorAll('[data-install]').forEach(b => b.hidden = false); });
  window.addEventListener('appinstalled', () => { INSTALL.installed = true; INSTALL.prompt = null; document.querySelectorAll('[data-install]').forEach(b => b.hidden = true); toast('RÉPARTI est installé 🎉'); });
}
ACT.install = async () => {
  if (INSTALL.prompt) { INSTALL.prompt.prompt(); try { await INSTALL.prompt.userChoice; } catch (e) {} INSTALL.prompt = null; return; }
  const ua = navigator.userAgent; const ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const steps = ios
    ? '<ol><li>Ouvre cette page dans <b>Safari</b>.</li><li>Touche le bouton <b>Partager</b> (carré avec une flèche ⬆️).</li><li>Choisis <b>« Sur l\'écran d\'accueil »</b>, puis <b>Ajouter</b>.</li></ol>'
    : /Android/.test(ua)
      ? '<ol><li>Ouvre cette page dans <b>Chrome</b>.</li><li>Touche le menu <b>⋮</b> en haut à droite.</li><li>Choisis <b>« Installer l\'application »</b> (ou « Ajouter à l\'écran d\'accueil »).</li></ol>'
      : '<ol><li>Ouvre cette page dans <b>Chrome</b> ou <b>Edge</b>.</li><li>Clique sur l\'icône <b>Installer</b> (écran avec une flèche ⬇️) à droite de la barre d\'adresse, ou menu <b>⋮ → Installer RÉPARTI</b>.</li><li>Sur Mac avec Safari : menu <b>Fichier → Ajouter au Dock</b>.</li></ol>';
  openModal(`${mh('📲 Installer RÉPARTI')}<p class="muted" style="margin-top:-6px">Une icône RÉPARTI apparaîtra sur ton appareil, comme une application normale.</p>${steps}<div class="mf"><button type="button" class="btn primary" data-act="closeModal">Compris</button></div>`);
};

render();
initCloud();
sbFromHash().then(ok => { if (!ok) sbSync(); });
</script>
